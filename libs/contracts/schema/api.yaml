$schema: https://json-schema.org/draft/2020-12/schema
$id: api.yaml
title: Engine HTTP API
description: >
  Request and response bodies of the engine's HTTP API (version 0), which the business
  layer's web app reads on behalf of a member. Every request names the tenant and the member
  it acts for; the engine checks every read against that member's permissions. Bodies that
  already have a type (GroundedAnswer, SearchResult, AnswerQuery) are not repeated here.

$defs:
  SpaceList:
    description: The spaces of the tenant the member may read.
    type: object
    required: [tenant, spaces]
    properties:
      tenant:
        $ref: "authz.yaml#/$defs/Tenant"
      spaces:
        type: array
        items:
          $ref: "authz.yaml#/$defs/Space"

  DocumentTree:
    description: A space's Documents tree as the member may see it, one node per source.
    type: object
    required: [space_id, sources]
    properties:
      space_id:
        $ref: "common.yaml#/$defs/SpaceId"
      sources:
        type: array
        items:
          $ref: "source.yaml#/$defs/DocumentTreeNode"

  DocumentView:
    description: >
      One document for its Original and Annotated views: the version shown, its blocks in
      reading order, and the marks on them.
    type: object
    required: [document, source_name, version, blocks, annotations]
    properties:
      document:
        $ref: "source.yaml#/$defs/DocumentEntry"
      source_name:
        type: string
      space_id:
        $ref: "common.yaml#/$defs/SpaceId"
      path:
        description: The folders from the source's root to the document.
        type: array
        items:
          type: string
      version:
        description: The version shown, without its stored blob.
        $ref: "source.yaml#/$defs/SourceVersion"
      blocks:
        type: array
        items:
          $ref: "source.yaml#/$defs/SourceBlock"
      annotations:
        $ref: "retrieval.yaml#/$defs/DocumentAnnotations"

  TopicList:
    description: The live topics of a space's knowledge outline, ordered by key; areas have no parent.
    type: object
    required: [space_id, topics]
    properties:
      space_id:
        $ref: "common.yaml#/$defs/SpaceId"
      topics:
        type: array
        items:
          $ref: "page.yaml#/$defs/TaxonomyNode"

  TopicView:
    description: >
      One topic as the member may read it: its current statements and its subtopics', and those
      of every other value of the facts they fill, wherever they are stated, all marked as
      search marks them; the statements that hold in place of the outdated and disputed ones;
      and the facts.
    type: object
    required: [topic, subtopics, statements, held, facts]
    properties:
      topic:
        $ref: "page.yaml#/$defs/TaxonomyNode"
      parent:
        $ref: "page.yaml#/$defs/TaxonomyNode"
      subtopics:
        type: array
        items:
          $ref: "page.yaml#/$defs/TaxonomyNode"
      statements:
        type: array
        items:
          $ref: "retrieval.yaml#/$defs/SearchHit"
      held:
        type: array
        items:
          $ref: "retrieval.yaml#/$defs/SearchHit"
      facts:
        description: The fact slots the statements fill, each with its label in the tenant's predicate catalogue.
        type: array
        items:
          type: object
          required: [slot_key]
          properties:
            slot_key:
              type: string
            label:
              type: string

  Inbox:
    description: >
      A member's open todos on the cards the inbox puts them on, most urgent card first, with
      what each todo asks them to choose between.
    type: object
    required: [cards]
    properties:
      cards:
        type: array
        items:
          $ref: "#/$defs/InboxCard"

  InboxCardKind:
    description: >
      review: an owner's todos about one topic in one week. notes: an owner's notes of one
      week. campaign: a space's first reviews of one topic. steward: todos of a topic nobody
      owns.
    type: string
    enum: [review, notes, campaign, steward]

  InboxCard:
    type: object
    required: [batch_key, kind, todos]
    properties:
      batch_key:
        type: string
      kind:
        $ref: "#/$defs/InboxCardKind"
      week:
        $ref: "collab.yaml#/$defs/IsoWeek"
      topic:
        description: The topic the card is about, when it has one.
        $ref: "page.yaml#/$defs/TaxonomyNode"
      todos:
        type: array
        items:
          $ref: "#/$defs/InboxTodo"

  InboxTodo:
    type: object
    required: [todo, statements, choices]
    properties:
      todo:
        $ref: "collab.yaml#/$defs/Todo"
      fact_label:
        description: >
          What the fact a conflict or a note is about is called in the tenant's predicate
          catalogue ("Hotel cap per night"); the slot's qualifiers are its scope.
        type: string
      statements:
        description: >
          The statements the todo is about (its claims), as the member may read them, in the
          todo's order: for a conflict, the best statement of each value, the proposed one first.
        type: array
        items:
          $ref: "retrieval.yaml#/$defs/SearchHit"
      choices:
        description: The resolutions the todo offers, in its order; for a conflict, the proposed value first.
        type: array
        items:
          $ref: "#/$defs/TodoChoice"

  TodoChoice:
    description: >
      One resolution a todo offers. For a conflict it chooses a value: the value, and the
      statement of it to show (one of the todo's statements, when the member may read it).
    type: object
    required: [key, label]
    properties:
      key:
        type: string
      label:
        type: string
      value:
        type: string
      unit_id:
        $ref: "common.yaml#/$defs/UnitId"

  ResolveTodo:
    description: >
      How the member resolves a todo assigned to them: done with one of the resolutions it
      offers, or dismissed. The response is the closed Todo.
    type: object
    properties:
      with:
        description: The key of the chosen resolution.
        type: string
        minLength: 1
      status:
        type: string
        enum: [done, dismissed]

  SpaceOverview:
    description: >
      What a space's maintainers see first: the work waiting in the space, the facts its
      readers see in dispute, and its documents by governance level with the latest changes,
      counting only the documents the member may open. Only a member who may administer the
      space reads it.
    type: object
    required: [space, work, unassigned, disputed, documents, levels, changes]
    properties:
      space:
        $ref: "authz.yaml#/$defs/Space"
      work:
        description: The space's open todos by kind, the most common first.
        type: array
        items:
          type: object
          required: [kind, count]
          properties:
            kind:
              $ref: "collab.yaml#/$defs/TodoKind"
            count:
              type: integer
              minimum: 1
      unassigned:
        description: Open todos about topics nobody owns, which fall to the space's maintainers.
        type: integer
        minimum: 0
      disputed:
        description: >
          The facts with an open conflict todo in the space whose readers see a dispute until
          someone decides, each with its label in the tenant's predicate catalogue.
        type: array
        items:
          type: object
          required: [slot_key]
          properties:
            slot_key:
              type: string
            label:
              type: string
      documents:
        type: integer
        minimum: 0
      levels:
        description: How many documents each governance level holds, in the order governed, reference, search_only.
        type: array
        items:
          type: object
          required: [level, documents]
          properties:
            level:
              $ref: "source.yaml#/$defs/GovernanceLevel"
            documents:
              type: integer
              minimum: 0
      changes:
        description: The documents fetched most recently, newest first, at most ten.
        type: array
        items:
          $ref: "#/$defs/SpaceChange"

  SpaceChange:
    description: A document as the latest sync left it, new to the space or an updated version.
    type: object
    required: [document, kind]
    properties:
      document:
        $ref: "source.yaml#/$defs/DocumentEntry"
      kind:
        type: string
        enum: [created, updated]

  SyncReport:
    description: >
      What syncing a source did: how many items it listed and what became of them. The response
      to syncing a source now, once the engine has read everything the sync changed.
    type: object
    required: [source_id, listed, outcomes, errors]
    properties:
      source_id:
        $ref: "common.yaml#/$defs/SourceId"
      listed:
        type: integer
        minimum: 0
      outcomes:
        type: object
        required: [created, updated, acl_changed, unchanged, deleted, failed]
        properties:
          created:
            type: integer
            minimum: 0
          updated:
            type: integer
            minimum: 0
          acl_changed:
            type: integer
            minimum: 0
          unchanged:
            type: integer
            minimum: 0
          deleted:
            type: integer
            minimum: 0
          failed:
            type: integer
            minimum: 0
      errors:
        type: array
        items:
          type: object
          required: [external_id, error]
          properties:
            external_id:
              type: string
            error:
              type: string

  ApiErrorCode:
    type: string
    enum: [bad_request, unauthenticated, forbidden, not_found, internal]

  ApiError:
    description: The body of every error response.
    type: object
    required: [error]
    properties:
      error:
        type: object
        required: [code, message]
        properties:
          code:
            $ref: "#/$defs/ApiErrorCode"
          message:
            type: string
