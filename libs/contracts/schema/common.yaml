$schema: https://json-schema.org/draft/2020-12/schema
$id: common.yaml
title: Common types
description: >
  Identifiers, time, labels and small value types shared by every other schema file.
  Every type name in contracts/schema must be unique across all files, because the
  bundler flattens them into one namespace.

$defs:
  # ---------------------------------------------------------------- identifiers
  # IDs are a type prefix plus an opaque suffix. New IDs use a ULID suffix
  # (newId in libs/contracts/src/ids.ts), but a component may use a content-derived suffix
  # when it needs stable IDs across rebuilds (for example spans that did not change).
  TenantId:
    type: string
    pattern: "^ten_[0-9A-Za-z]{8,64}$"
  SpaceId:
    type: string
    pattern: "^spc_[0-9A-Za-z]{8,64}$"
  MemberId:
    description: One person inside one tenant; unique only within the tenant. A PrincipalId of kind member.
    type: string
    pattern: "^mem_[0-9A-Za-z]{8,64}$"
  SourceId:
    type: string
    pattern: "^src_[0-9A-Za-z]{8,64}$"
  SourceVersionId:
    type: string
    pattern: "^sv_[0-9A-Za-z]{8,64}$"
  SourceBlockId:
    description: A block of a source document (not a page block, which has a BlockKey).
    type: string
    pattern: "^blk_[0-9A-Za-z]{8,64}$"
  SpanId:
    type: string
    pattern: "^spn_[0-9A-Za-z]{8,64}$"
  ChunkId:
    type: string
    pattern: "^chk_[0-9A-Za-z]{8,64}$"
  ClaimId:
    type: string
    pattern: "^clm_[0-9A-Za-z]{8,64}$"
  EntityId:
    type: string
    pattern: "^ent_[0-9A-Za-z]{8,64}$"
  RelationId:
    type: string
    pattern: "^rel_[0-9A-Za-z]{8,64}$"
  SopId:
    type: string
    pattern: "^sop_[0-9A-Za-z]{8,64}$"
  KnowledgeModelId:
    type: string
    pattern: "^kmd_[0-9A-Za-z]{8,64}$"
  PageId:
    type: string
    pattern: "^pg_[0-9A-Za-z]{8,64}$"
  CommentId:
    type: string
    pattern: "^cmt_[0-9A-Za-z]{8,64}$"
  OverrideId:
    type: string
    pattern: "^ovr_[0-9A-Za-z]{8,64}$"
  ProposalId:
    type: string
    pattern: "^prp_[0-9A-Za-z]{8,64}$"
  TodoId:
    type: string
    pattern: "^todo_[0-9A-Za-z]{8,64}$"
  ConflictId:
    type: string
    pattern: "^cfl_[0-9A-Za-z]{8,64}$"
  PublishRequestId:
    type: string
    pattern: "^pub_[0-9A-Za-z]{8,64}$"
  ViewId:
    type: string
    pattern: "^view_[0-9A-Za-z]{8,64}$"
  ViewTemplateId:
    description: A view template name, for example "sop.step_navigator".
    type: string
    pattern: "^[a-z][a-z0-9_]*(\\.[a-z][a-z0-9_]*)+$"
  EventId:
    type: string
    pattern: "^evt_[0-9A-Za-z]{8,64}$"
  RunId:
    description: One pipeline run (a compile, a governance sweep, a research run).
    type: string
    pattern: "^run_[0-9A-Za-z]{8,64}$"
  RequestId:
    type: string
    pattern: "^req_[0-9A-Za-z]{8,64}$"
  UnitId:
    description: >
      Any addressable knowledge unit. Used wherever a field can point at several kinds,
      such as lineage, freshness dependencies, todos and search hits.
    type: string
    pattern: "^(src|sv|blk|spn|chk|clm|ent|rel|sop|kmd|pg|cmt|ovr|prp|todo|cfl|view)_[0-9A-Za-z]{8,64}$"
  PrincipalId:
    description: >
      A canonical principal. mem = member (one person inside one tenant), grp = group,
      dep = department, agt = agent identity, svc = internal service account. Principal IDs
      are unique only within their tenant, so anything kept outside a tenant's own rows keeps
      the tenant with them. The business layer's user (account) IDs never reach the engine.
    type: string
    pattern: "^(mem|grp|dep|agt|svc)_[0-9A-Za-z]{8,64}$"
  PluginName:
    description: Registry name of a plugin or source type, for example "feishu.docx".
    type: string
    pattern: "^[a-z][a-z0-9_]*(\\.[a-z][a-z0-9_]*)*$"
  ComponentName:
    description: >
      Component that produced an event or artifact, in kebab case, for example
      "extraction" or "page-compiler". It is also the consumer group name of the
      component's event handlers.
    type: string
    pattern: "^[a-z][a-z0-9]*(-[a-z0-9]+)*$"

  # ---------------------------------------------------------------- values
  Instant:
    description: RFC 3339 timestamp, UTC.
    type: string
    format: date-time
  Duration:
    description: ISO 8601 duration, for example "P30D" or "PT15M".
    type: string
    pattern: "^P(\\d+Y)?(\\d+M)?(\\d+W)?(\\d+D)?(T(\\d+H)?(\\d+M)?(\\d+(\\.\\d+)?S)?)?$"
  Interval:
    description: Half-open time interval [start, end). A missing bound means open.
    type: object
    properties:
      start:
        $ref: "#/$defs/Instant"
      end:
        $ref: "#/$defs/Instant"
  Score01:
    type: number
    minimum: 0
    maximum: 1
  ContentHash:
    description: Hex SHA-256 with an algorithm prefix.
    type: string
    pattern: "^sha256:[0-9a-f]{64}$"
  Locale:
    type: string
    pattern: "^[a-z]{2,3}(-[A-Za-z0-9]{2,8})*$"
    examples: ["zh-CN", "en", "zh-TW"]
  InlineMarkdown:
    description: >
      One line of CommonMark inline syntax: emphasis, strong, code, links and
      strikethrough only. Links to knowledge units use the scheme
      "inspiration://<unit id>". No raw HTML.
    type: string
  Markdown:
    description: CommonMark plus GFM tables and task lists. No raw HTML.
    type: string
  SensitivityLabel:
    description: >
      Ordered from least to most sensitive. A derived unit takes the highest label of
      its sources. Model routing never sends content above a provider's allowed label.
    type: string
    enum: [public, internal, confidential, secret]
  Cursor:
    description: Opaque pagination or sync cursor. Only its producer may parse it.
    type: string
  BlobRef:
    description: A stored binary object (an uploaded file, an image, a view bundle).
    type: object
    required: [uri, sha256, size_bytes, mime_type]
    properties:
      uri:
        description: Store-specific URI, for example "file:///data/blobs/ab/cd..." or "s3://bucket/key".
        type: string
      sha256:
        $ref: "#/$defs/ContentHash"
      size_bytes:
        type: integer
        minimum: 0
      mime_type:
        type: string
      filename:
        type: string
  ProducerInfo:
    description: >
      Who or what produced an artifact. The freshness engine folds name, version,
      model and prompt_version into the artifact's inputs hash, so bumping any of them
      marks outputs dirty.
    type: object
    required: [component, name, version]
    properties:
      component:
        $ref: "#/$defs/ComponentName"
      name:
        description: Plugin or stage name, for example "claims.default".
        type: string
      version:
        type: string
      model:
        type: string
      prompt_version:
        type: string
      run_id:
        $ref: "#/$defs/RunId"
