$schema: https://json-schema.org/draft/2020-12/schema
$id: collab.yaml
title: Collaboration and publishing
description: >
  Comments, change proposals, overrides, todos and the publish flow (collaboration). A human edit is
  stored as a pinned override bound to a block's anchor, never as a patch to generated
  text, so regeneration can re-apply it and raise a todo instead of overwriting it.

$defs:
  TextQuote:
    description: W3C Web Annotation style text-quote selector, the fallback when a block key moves.
    type: object
    required: [exact]
    properties:
      exact:
        type: string
      prefix:
        type: string
      suffix:
        type: string

  Anchor:
    description: Where a comment or override attaches on a page.
    type: object
    required: [page_id, page_version, block_key]
    properties:
      page_id:
        $ref: "common.yaml#/$defs/PageId"
      page_version:
        description: The version the anchor was created on.
        type: integer
        minimum: 1
      block_key:
        $ref: "page.yaml#/$defs/BlockKey"
      claim_ids:
        description: Claims of the anchored block at creation, used to re-anchor after regeneration.
        type: array
        items:
          $ref: "common.yaml#/$defs/ClaimId"
      sentence_index:
        type: integer
        minimum: 0
      row_key:
        description: Table row key, when anchored to a row.
        type: string
      quote:
        $ref: "#/$defs/TextQuote"

  AuthorKind:
    type: string
    enum: [human, agent]

  CommentIntent:
    description: How the comment agent classified the comment.
    type: string
    enum: [question, correction, request, approval, other]

  CommentStatus:
    description: orphaned = the anchor could not be found after regeneration; shown in a side panel, never dropped.
    type: string
    enum: [open, answered, resolved, orphaned]

  Comment:
    type: object
    required: [id, tenant_id, page_id, anchor, author_id, author_kind, body, status, created_at]
    properties:
      id:
        $ref: "common.yaml#/$defs/CommentId"
      tenant_id:
        $ref: "common.yaml#/$defs/TenantId"
      page_id:
        $ref: "common.yaml#/$defs/PageId"
      thread_id:
        description: The first comment of the thread. Absent on the first comment itself.
        $ref: "common.yaml#/$defs/CommentId"
      anchor:
        $ref: "#/$defs/Anchor"
      author_id:
        $ref: "common.yaml#/$defs/PrincipalId"
      author_kind:
        $ref: "#/$defs/AuthorKind"
      on_behalf_of:
        description: For agent comments made for a person.
        $ref: "common.yaml#/$defs/PrincipalId"
      body:
        $ref: "common.yaml#/$defs/Markdown"
      intent:
        $ref: "#/$defs/CommentIntent"
      status:
        $ref: "#/$defs/CommentStatus"
      citations:
        description: Spans the agent cited in a reply.
        type: array
        items:
          $ref: "common.yaml#/$defs/SpanId"
      proposal_id:
        $ref: "common.yaml#/$defs/ProposalId"
      created_at:
        $ref: "common.yaml#/$defs/Instant"
      updated_at:
        $ref: "common.yaml#/$defs/Instant"

  ProposalKind:
    type: string
    enum: [edit_block, add_block, remove_block, restructure, claim_change]

  ProposalStatus:
    type: string
    enum: [proposed, accepted, rejected, applied, superseded]

  ClaimChangeOp:
    type: string
    enum: [add, retract, supersede, update]

  ClaimChange:
    type: object
    required: [op]
    properties:
      op:
        $ref: "#/$defs/ClaimChangeOp"
      claim_id:
        $ref: "common.yaml#/$defs/ClaimId"
      claim:
        $ref: "knowledge.yaml#/$defs/Claim"

  ChangeProposal:
    description: An edit the agent proposes in response to a comment or a governance finding.
    type: object
    required: [id, tenant_id, page_id, kind, proposed_by, rationale, status, created_at]
    properties:
      id:
        $ref: "common.yaml#/$defs/ProposalId"
      tenant_id:
        $ref: "common.yaml#/$defs/TenantId"
      page_id:
        $ref: "common.yaml#/$defs/PageId"
      block_key:
        $ref: "page.yaml#/$defs/BlockKey"
      comment_id:
        $ref: "common.yaml#/$defs/CommentId"
      kind:
        $ref: "#/$defs/ProposalKind"
      after:
        $ref: "page.yaml#/$defs/Block"
      claim_changes:
        type: array
        items:
          $ref: "#/$defs/ClaimChange"
      rationale:
        type: string
      evidence_span_ids:
        type: array
        items:
          $ref: "common.yaml#/$defs/SpanId"
      proposed_by:
        $ref: "common.yaml#/$defs/PrincipalId"
      status:
        $ref: "#/$defs/ProposalStatus"
      auto_applicable:
        description: True only for changes policy allows without review, such as typo fixes.
        type: boolean
      decided_by:
        $ref: "common.yaml#/$defs/PrincipalId"
      decided_at:
        $ref: "common.yaml#/$defs/Instant"
      created_at:
        $ref: "common.yaml#/$defs/Instant"

  OverrideMode:
    description: >
      replace = show content instead of the generated block; hide = hide the block;
      insert_after = add content after the anchored block; pin = freeze the generated
      block as it is now.
    type: string
    enum: [replace, hide, insert_after, pin]

  OverrideStatus:
    description: conflicted = sources now disagree with the override; its author has a todo.
    type: string
    enum: [active, conflicted, retired]

  Override:
    type: object
    required: [id, tenant_id, page_id, anchor, mode, author_id, status, created_at]
    properties:
      id:
        $ref: "common.yaml#/$defs/OverrideId"
      tenant_id:
        $ref: "common.yaml#/$defs/TenantId"
      page_id:
        $ref: "common.yaml#/$defs/PageId"
      anchor:
        $ref: "#/$defs/Anchor"
      mode:
        $ref: "#/$defs/OverrideMode"
      content:
        $ref: "page.yaml#/$defs/Block"
      author_id:
        $ref: "common.yaml#/$defs/PrincipalId"
      reason:
        type: string
      asserted_claim_ids:
        description: Human-origin claims created because the edit asserts new facts.
        type: array
        items:
          $ref: "common.yaml#/$defs/ClaimId"
      status:
        $ref: "#/$defs/OverrideStatus"
      conflict_todo_id:
        $ref: "common.yaml#/$defs/TodoId"
      created_at:
        $ref: "common.yaml#/$defs/Instant"
      updated_at:
        $ref: "common.yaml#/$defs/Instant"

  TodoKind:
    description: >
      note: a value only reference documents state disagrees with the governed one. It
      asks for no decision: the owner acknowledges it, and it is not counted against the
      weekly budget. unstated: a new version of a document stopped stating claims, which are
      kept, marked, until the owner keeps or retires them; source_deleted: the same for a
      deleted document (docs/design/source-changes.md).
    type: string
    enum:
      - conflict
      - stale
      - override_conflict
      - review_due
      - assumption_drift
      - comment_followup
      - publish_review
      - coverage_gap
      - extraction_review
      - feedback
      - note
      - unstated
      - source_deleted

  TodoStatus:
    type: string
    enum: [open, in_progress, done, dismissed]

  Priority:
    type: string
    enum: [low, normal, high, urgent]

  TodoResolution:
    description: A one-click resolution offered on a todo.
    type: object
    required: [key, label]
    properties:
      key:
        type: string
      label:
        type: string
      description:
        type: string
      effect:
        description: Machine-readable effect, interpreted by the todo's producer.
        type: object

  Todo:
    type: object
    required: [id, tenant_id, space_id, kind, title, priority, status, unit_ids, created_by, created_at]
    properties:
      id:
        $ref: "common.yaml#/$defs/TodoId"
      tenant_id:
        $ref: "common.yaml#/$defs/TenantId"
      space_id:
        $ref: "common.yaml#/$defs/SpaceId"
      kind:
        $ref: "#/$defs/TodoKind"
      title:
        type: string
      detail:
        $ref: "common.yaml#/$defs/Markdown"
      priority:
        $ref: "#/$defs/Priority"
      status:
        $ref: "#/$defs/TodoStatus"
      assignee_id:
        $ref: "common.yaml#/$defs/PrincipalId"
      unit_ids:
        type: array
        items:
          $ref: "common.yaml#/$defs/UnitId"
      resolutions:
        type: array
        items:
          $ref: "#/$defs/TodoResolution"
      batch_key:
        description: >
          The inbox card the todo is on. Collaboration groups an owner's todos about one topic
          in one week on a card, at most 20 to a card.
        type: string
      taxonomy_key:
        description: The topic its units are placed in. The topic's owner, or its area's, is the assignee.
        $ref: "page.yaml#/$defs/TopicKey"
      slot_key:
        description: The fact slot a conflict or a note is about.
        type: string
      week:
        description: >
          The week it is scheduled in: the week it fell due, or a later one when the
          assignee's weekly budget of cards was full.
        $ref: "#/$defs/IsoWeek"
      created_by:
        $ref: "common.yaml#/$defs/ComponentName"
      created_at:
        $ref: "common.yaml#/$defs/Instant"
      due_at:
        $ref: "common.yaml#/$defs/Instant"
      resolved_by:
        $ref: "common.yaml#/$defs/PrincipalId"
      resolved_with:
        description: Key of the chosen resolution.
        type: string
      resolved_at:
        $ref: "common.yaml#/$defs/Instant"

  IsoWeek:
    description: An ISO 8601 week, "2026-W44".
    type: string
    pattern: "^[0-9]{4}-W(0[1-9]|[1-4][0-9]|5[0-3])$"

  TodoSuggestion:
    description: >
      The resolution the assistant would choose on a todo, with why, so the inbox shows it
      selected and one press accepts it.
    type: object
    required: [with, reason]
    properties:
      with:
        description: The key of the resolution.
        type: string
        minLength: 1
      reason:
        description: One or two sentences, in the member's language.
        type: string
        minLength: 1

  TodoLeft:
    description: >
      Why the assistant left a todo to the member when asked to decide it: it is not sure,
      another person decided the case otherwise or left an open comment on it, or the kind is
      one it never decides.
    type: object
    required: [reason]
    properties:
      reason:
        description: One line, in the member's language.
        type: string
        minLength: 1

  DecisionVia:
    description: >
      How the member asked the assistant to decide. assistant_once: on one todo.
      assistant_batch: on a card, or on several todos at once. delegation: their standing
      Decide for me, as the todo arrived.
    type: string
    enum: [assistant_once, assistant_batch, delegation]

  TodoDecision:
    description: >
      A todo the assistant resolved in a member's name, with that member's rights and no more.
      It counts as the member's own decision, made by the assistant. Undoing it reopens the
      todo and restores what the resolution changed, by a new decision; nothing is deleted.
    type: object
    required: [id, todo, with, label, reason, via, decided_by, decided_at]
    properties:
      id:
        $ref: "common.yaml#/$defs/DecisionId"
      todo:
        description: The todo as the decision closed it.
        $ref: "#/$defs/Todo"
      with:
        description: The key of the chosen resolution.
        type: string
        minLength: 1
      label:
        description: The chosen resolution's label, as the todo offered it.
        type: string
      reason:
        description: One or two sentences on why, in the member's language.
        type: string
        minLength: 1
      span_ids:
        description: The passages the decision rests on.
        type: array
        items:
          $ref: "common.yaml#/$defs/SpanId"
      via:
        $ref: "#/$defs/DecisionVia"
      decided_by:
        description: The member in whose name the assistant decided.
        $ref: "common.yaml#/$defs/PrincipalId"
      decided_at:
        $ref: "common.yaml#/$defs/Instant"
      undone_at:
        description: When the member undid it; absent while it stands.
        $ref: "common.yaml#/$defs/Instant"

  DelegationState:
    description: >
      unset: the member has not answered the offer yet, so the inbox makes it. on: the
      assistant decides as todos arrive. paused: it does not, until the member turns it on.
    type: string
    enum: [unset, "on", paused]

  Delegation:
    description: >
      A member's standing Decide for me. While it is on, the assistant decides the member's
      new todos of these kinds as they arrive (via delegation) and leaves the rest marked with
      why, so the inbox shows only what was left. Declining the offer pauses it, by the person.
      It pauses itself, undone, when the member undoes 2 of the assistant's last 10 decisions
      of one kind.
    type: object
    required: [state, kinds]
    properties:
      state:
        $ref: "#/$defs/DelegationState"
      kinds:
        description: The kinds of todo it decides, the routine reviews and conflicts.
        type: array
        items:
          $ref: "#/$defs/TodoKind"
      paused_reason:
        description: Who paused it, when paused.
        type: string
        enum: [person, undone]
      changed_at:
        description: When the state last changed; absent while unset.
        $ref: "common.yaml#/$defs/Instant"

  PublishState:
    type: string
    enum: [draft, in_review, published, retired]

  QualityGate:
    type: string
    enum: [citations, conflicts, pii, permission_widening, freshness]

  QualityGateResult:
    type: object
    required: [gate, passed]
    properties:
      gate:
        $ref: "#/$defs/QualityGate"
      passed:
        type: boolean
      details:
        type: string
      unit_ids:
        type: array
        items:
          $ref: "common.yaml#/$defs/UnitId"

  PublishRequest:
    description: Bottom-up publishing of a unit from one space into a wider one.
    type: object
    required: [id, tenant_id, unit_id, from_space_id, to_space_id, requested_by, state, created_at]
    properties:
      id:
        $ref: "common.yaml#/$defs/PublishRequestId"
      tenant_id:
        $ref: "common.yaml#/$defs/TenantId"
      unit_id:
        $ref: "common.yaml#/$defs/UnitId"
      from_space_id:
        $ref: "common.yaml#/$defs/SpaceId"
      to_space_id:
        $ref: "common.yaml#/$defs/SpaceId"
      requested_by:
        $ref: "common.yaml#/$defs/PrincipalId"
      state:
        $ref: "#/$defs/PublishState"
      gates:
        type: array
        items:
          $ref: "#/$defs/QualityGateResult"
      widens_visibility:
        description: True when readers of the target space could not read some sources. Needs source-owner approval.
        type: boolean
      approver_ids:
        type: array
        items:
          $ref: "common.yaml#/$defs/PrincipalId"
      decided_by:
        $ref: "common.yaml#/$defs/PrincipalId"
      decided_at:
        $ref: "common.yaml#/$defs/Instant"
      created_at:
        $ref: "common.yaml#/$defs/Instant"
