$schema: https://json-schema.org/draft/2020-12/schema
$id: authz.yaml
title: Identity, permissions and audit
description: >
  Types for access control. Source ACLs are mirrored as relationship tuples in SpiceDB. Retrieval
  pre-filters inside the index with IndexFilter, then re-checks each result. Agents always
  act on behalf of a member, with that member's rights intersected with the agent's scope.

$defs:
  PrincipalKind:
    type: string
    enum: [member, group, department, agent, service]

  Principal:
    description: The caller of any API. Agent principals must carry on_behalf_of, the member they act for.
    type: object
    required: [id, kind, tenant_id]
    properties:
      id:
        $ref: "common.yaml#/$defs/PrincipalId"
      kind:
        $ref: "#/$defs/PrincipalKind"
      tenant_id:
        $ref: "common.yaml#/$defs/TenantId"
      display_name:
        type: string
      on_behalf_of:
        $ref: "common.yaml#/$defs/PrincipalId"
      agent_scopes:
        description: For agents, the permissions the agent was granted. Effective rights are the intersection with the member's.
        type: array
        items:
          $ref: "#/$defs/Permission"
      space_scope:
        description: For agents, the spaces the agent may touch. Absent means every space the member can read.
        type: array
        items:
          $ref: "common.yaml#/$defs/SpaceId"
      scopes:
        description: >
          What the principal token lets its holder do, on top of the holder's permissions. A
          principal without scopes came from the engine itself (a worker or a test) and is not
          limited by them.
        type: array
        items:
          $ref: "#/$defs/Scope"
      max_sensitivity:
        description: >
          The highest label the principal token lets its holder read (its max_sens). It narrows
          the holder's clearance and never widens it. Absent means the clearance alone decides.
        $ref: "common.yaml#/$defs/SensitivityLabel"
      locale:
        description: The account's UI language, for anything the engine writes for this principal.
        $ref: "common.yaml#/$defs/Locale"
      auth_context:
        $ref: "#/$defs/AuthContext"

  Scope:
    description: >
      A grant a principal token carries. knowledge.read reads; knowledge.propose resolves todos,
      syncs a source and proposes changes; knowledge.write and comments.write are for agents
      acting on a member's request; provision.directory provisions tenants and members, for the
      business layer's tenancy service.
    type: string
    enum: [knowledge.read, knowledge.propose, knowledge.write, comments.write, provision.directory]

  AuthContext:
    description: How the session behind a token signed in. It feeds policy only (for example MFA for admin commands), never identity.
    type: object
    required: [method, mfa, at]
    properties:
      method:
        description: The sign-in method, such as password, email_code or sso.
        type: string
      mfa:
        type: boolean
      at:
        $ref: "common.yaml#/$defs/Instant"

  PrincipalClaims:
    description: >
      The payload of a principal token: a JWT the business layer signs with EdDSA (Ed25519) and
      the engine verifies against the business layer's published keys (JWKS). The web backend
      mints one per tenant context, valid at most 5 minutes; OAuth access tokens for agents use
      the same claims. sub is never a user (account) ID. iat and exp are seconds since the epoch.
    type: object
    required: [iss, aud, sub, tid, kind, scope, iat, exp, jti]
    properties:
      iss:
        description: The business layer's URL.
        type: string
      aud:
        description: The engine's URL, or a list that includes it.
        oneOf:
          - type: string
          - type: array
            items:
              type: string
            minItems: 1
      sub:
        $ref: "common.yaml#/$defs/PrincipalId"
      tid:
        $ref: "common.yaml#/$defs/TenantId"
      kind:
        $ref: "#/$defs/PrincipalKind"
      scope:
        description: Scope values separated by single spaces.
        type: string
      locale:
        $ref: "common.yaml#/$defs/Locale"
      auth:
        $ref: "#/$defs/AuthContext"
      obo:
        description: For agents, the member they act for.
        $ref: "common.yaml#/$defs/PrincipalId"
      spaces:
        description: For agents, the spaces they may touch.
        type: array
        items:
          $ref: "common.yaml#/$defs/SpaceId"
      max_sens:
        description: Narrows the holder's clearance; it never widens it.
        $ref: "common.yaml#/$defs/SensitivityLabel"
      grant:
        description: For agents, the grant ID, for revocation.
        type: string
      iat:
        type: integer
      exp:
        type: integer
      jti:
        type: string

  Permission:
    type: string
    enum: [discover, read, comment, edit, verify, publish, admin]

  ResourceType:
    type: string
    enum: [tenant, space, source, document, claim, page, sop, entity, knowledge_model, comment, todo, view_template]

  ResourceRef:
    type: object
    required: [type, id]
    properties:
      type:
        $ref: "#/$defs/ResourceType"
      id:
        description: >
          The resource's ID. Documents use "<source id>:<external id>", because source
          documents have no Inspiration ID of their own.
        type: string

  Decision:
    type: object
    required: [allow]
    properties:
      allow:
        type: boolean
      reason:
        type: string
      consistency_token:
        description: SpiceDB ZedToken, so a later read can ask for at-least-as-fresh results.
        type: string

  IndexFilter:
    description: >
      Pushed into the search index as a pre-filter. A row matches when its space is in
      space_ids, its acl_tokens overlap principal_tokens, and its sensitivity is at most
      max_sensitivity. Results are still re-checked before they leave the server.
    type: object
    required: [space_ids, principal_tokens, max_sensitivity]
    properties:
      space_ids:
        type: array
        items:
          $ref: "common.yaml#/$defs/SpaceId"
      principal_tokens:
        description: >
          The tenant tokens the viewer matches: tenant:<tenant ID> for a member of the tenant,
          system:<tenant ID> for its services. Spaces decide who reads a row; the tokens keep
          tenants apart inside the index.
        type: array
        items:
          type: string
      max_sensitivity:
        $ref: "common.yaml#/$defs/SensitivityLabel"

  DerivedReadDecision:
    description: >
      Result of the derived-knowledge rule. readable_support lists the sources the viewer
      may see; the caller cites only those. Hidden support is never counted or named.
    type: object
    required: [allow, readable_support]
    properties:
      allow:
        type: boolean
      readable_support:
        type: array
        items:
          $ref: "common.yaml#/$defs/UnitId"

  AclPrincipalKind:
    description: >
      Principals as the source system names them: a user is a person there, which the
      directory maps to a member. anyone_in_tenant and anyone_with_link are tracked separately because existing
      oversharing ("anyone in the company with the link") is the biggest go-live risk.
    type: string
    enum: [user, group, department, tenant, anyone_in_tenant, anyone_with_link, public, external]

  AclRole:
    type: string
    enum: [viewer, commenter, editor, owner]

  AclEntry:
    type: object
    required: [principal_kind, role]
    properties:
      principal_kind:
        $ref: "#/$defs/AclPrincipalKind"
      external_id:
        description: The principal's ID in the source system. Absent for anyone_* and public.
        type: string
      principal_id:
        description: Canonical principal, once access control has mapped external_id. Unmapped principals are denied.
        $ref: "common.yaml#/$defs/PrincipalId"
      role:
        $ref: "#/$defs/AclRole"

  AclSnapshot:
    type: object
    required: [source_id, external_id, fidelity, entries, captured_at, acl_hash]
    properties:
      source_id:
        $ref: "common.yaml#/$defs/SourceId"
      external_id:
        type: string
      fidelity:
        $ref: "source.yaml#/$defs/AclFidelity"
      entries:
        type: array
        items:
          $ref: "#/$defs/AclEntry"
      inherits_from_external_id:
        type: string
      captured_at:
        $ref: "common.yaml#/$defs/Instant"
      acl_hash:
        $ref: "common.yaml#/$defs/ContentHash"

  SpaceKind:
    type: string
    enum: [personal, team, org, source_mirror]

  SpaceRole:
    description: >
      A role on a space, from the least: viewer reads, commenter also comments, editor also
      edits, steward also verifies and publishes, owner also administers the space and sets its
      audience. A role on a space holds in every space below it.
    type: string
    enum: [viewer, commenter, editor, steward, owner]

  SpaceGrant:
    description: One entry of a space's audience. principal_id "tenant" is everyone in the company.
    type: object
    required: [principal_id, role]
    properties:
      principal_id:
        anyOf:
          - $ref: "common.yaml#/$defs/MemberId"
          - const: tenant
      role:
        $ref: "#/$defs/SpaceRole"

  Space:
    description: >
      A container that holds permissions. Personal, team, org, or a mirror of one source.
      owner_id is the first of its owners (SpaceEntry lists them all).
    type: object
    required: [id, tenant_id, kind, name, owner_id, default_sensitivity, created_at]
    properties:
      id:
        $ref: "common.yaml#/$defs/SpaceId"
      tenant_id:
        $ref: "common.yaml#/$defs/TenantId"
      kind:
        $ref: "#/$defs/SpaceKind"
      name:
        type: string
      description:
        type: string
      parent_id:
        $ref: "common.yaml#/$defs/SpaceId"
      owner_id:
        $ref: "common.yaml#/$defs/PrincipalId"
      default_sensitivity:
        $ref: "common.yaml#/$defs/SensitivityLabel"
      created_at:
        $ref: "common.yaml#/$defs/Instant"

  Tenant:
    description: A tenant as the business layer provisions it (tenancy.yaml). kind, status, default_locale and version are absent only for tenants a corpus stands in for.
    type: object
    required: [id, name, created_at]
    properties:
      id:
        $ref: "common.yaml#/$defs/TenantId"
      name:
        type: string
      kind:
        $ref: "tenancy.yaml#/$defs/TenantKind"
      status:
        $ref: "tenancy.yaml#/$defs/TenantStatus"
      default_locale:
        $ref: "common.yaml#/$defs/Locale"
      version:
        $ref: "tenancy.yaml#/$defs/DirectoryVersion"
      created_at:
        $ref: "common.yaml#/$defs/Instant"

  AuditChannel:
    type: string
    enum: [web, mcp, rest, cli, internal]

  AuditDecision:
    type: string
    enum: [allow, deny]

  AuditEvent:
    description: One audited action. Written by access control; agent calls are audited per call by the agent API.
    type: object
    required: [id, tenant_id, at, actor_id, action, channel]
    properties:
      id:
        type: string
      tenant_id:
        $ref: "common.yaml#/$defs/TenantId"
      at:
        $ref: "common.yaml#/$defs/Instant"
      actor_id:
        $ref: "common.yaml#/$defs/PrincipalId"
      on_behalf_of:
        $ref: "common.yaml#/$defs/PrincipalId"
      action:
        description: Dotted action name, for example "page.read", "mcp.get_sop", "source.connect".
        type: string
      resource:
        $ref: "#/$defs/ResourceRef"
      decision:
        $ref: "#/$defs/AuditDecision"
      reason:
        type: string
      channel:
        $ref: "#/$defs/AuditChannel"
      request_id:
        $ref: "common.yaml#/$defs/RequestId"
      details:
        type: object
