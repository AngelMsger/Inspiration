[project]
name = "inspiration-store"
version = "0.1.0"
description = "M10: knowledge store (schema, repository API, lineage, bi-temporal reads, page snapshots, DataRef resolution, pgvector and pg_search indexes)"
requires-python = ">=3.12"
dependencies = [
  "inspiration-contracts",
  "inspiration-kernel",
  "inspiration-eventbus",
  "psycopg[binary,pool]>=3.2",
]

[project.entry-points."inspiration.migrations"]
kb = "inspiration.store:MIGRATIONS"

[project.entry-points."inspiration.vector_indexes"]
pgvector = "inspiration.store.indexes:PgVectorIndex"
memory = "inspiration.store.indexes:MemoryVectorIndex"

[project.entry-points."inspiration.keyword_indexes"]
pg_search = "inspiration.store.indexes:PgSearchIndex"
memory = "inspiration.store.indexes:MemoryKeywordIndex"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inspiration"]

[tool.uv.sources]
inspiration-contracts = { workspace = true }
inspiration-kernel = { workspace = true }
inspiration-eventbus = { workspace = true }
