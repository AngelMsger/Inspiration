[project]
name = "inspiration-authz"
version = "0.1.0"
description = "M13: permissions on SpiceDB, source ACL mirroring, index pre-filters, the derived-knowledge rule"
requires-python = ">=3.12"
dependencies = [
  "inspiration-contracts",
  "inspiration-kernel",
  "inspiration-store",
  "authzed>=1.25",
  "grpcio>=1.63",
]

[project.scripts]
inspiration-authz-schema = "inspiration.authz.spicedb:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inspiration"]

[tool.uv.sources]
inspiration-contracts = { workspace = true }
inspiration-kernel = { workspace = true }
inspiration-store = { workspace = true }
