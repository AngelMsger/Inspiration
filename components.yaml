# Component manifest: who owns what, which events each component publishes and consumes,
# which synchronous APIs it may call, and which plugin groups it provides. test/manifest.test.ts
# checks it against the event catalogue, the plugin groups and the workspace packages.
# Each section has its own top-level directory: components in engine/, libraries in libs/,
# apps in apps/; business-layer packages go in business/, and engine/ and libs/ never
# depend on them.
#
# Every component is named for what it does. The name is also its package
# (engine/<name>, published as @inspiration/<name>), its event producer name, its
# consumer group and the first part of its model task names (<name>.<verb_object>).
#
# layer:     ingest | compile | store | serve | control (see docs/architecture.md)
# status:    built = in the workspace with tests; planned = not started;
#            in_progress = someone is building it (put the branch in `owner`).
# runtime:   node (a TypeScript package) or python (a worker behind an HTTP contract).
# plugins:   plugin groups the component's package declares, migrations included.
# publishes, subscribes and calls give the whole design, planned parts included; a built
#            component's `owns` ends with what is still planned ("Planned are ...").
# calls:     the only synchronous dependencies allowed: other components, or `blobs`
#            (the kernel's blob store). A built component's package may depend on the
#            libraries below and on the components it calls, nothing else.
#
# Engine only: people, tenants, sign-in, publishing policy and the web app belong to the
# business layer, which calls the engine and consumes its events (docs/architecture.md).

components:
  connectors:
    title: Connector SDK and connectors
    layer: ingest
    status: built
    runtime: node
    owns: One integration per vendor (Feishu first) for sync and agent tools alike, which enumerates, fetches and reads ACLs; built for local folders, and for Feishu documents and approvals against recorded fixtures. Planned are the typed client over the live vendor API, with one scope set and one rate budget per connection and a share kept for interactive tool calls; webhooks, which publish source.changed; the Feishu wiki connector; registered queries for QueryData; agent tools (agent_tools plugins), each acting as the member with the member's own connection; credentials only as leases from the credential broker
    plugins: [connectors]
    publishes: [source.changed]
    subscribes: []
    calls: [blobs]

  source-sync:
    title: Source sync
    layer: ingest
    status: built
    runtime: node
    owns: Lists a source page by page, fetches the items whose hashes changed, and stores source versions, tombstones and ACL snapshots with each version's governance level; syncs a source or one item when asked; the Documents tree; uploads, each space's upload area of files people put in (sync.uploads), stored as a source's items are. Planned are 15-minute polls and the nightly reconcile as schedules, rate budgets, subscription upkeep, debounce, publishing source.changed, SourceSync.fetch_now, removing an upload
    plugins: [migrations]
    publishes: [source.changed, document.fetched, acl.changed]
    subscribes: [source.changed]
    calls: [knowledge-store, blobs]

  parsing:
    title: Document parsing worker
    layer: ingest
    status: built
    runtime: python
    owns: Stateless parsing of Word, PowerPoint, Excel and PDF files (their text layer) into normalized blocks with anchors, in a Python worker behind an HTTP contract, and the worker parser normalization's router picks for those types; subscribes to nothing. Planned are scans and images through OCR on the model gateway, and layout models for complex PDFs
    plugins: [parsers]
    publishes: []
    subscribes: []
    calls: [model-gateway, blobs]

  normalization:
    title: Normalization
    layer: ingest
    status: built
    runtime: node
    owns: Parser routing over the built-in Markdown, text, HTML and CSV parsers and the parsing worker's parser for Word, PowerPoint, Excel and PDF; canonical blocks and spans with stable IDs; block diff against the previous version; duplicate documents and editions of one document. Planned are scans, a language tag per block, mirror pages
    plugins: [parsers, migrations]
    publishes: [blocks.changed]
    subscribes: [document.fetched]
    calls: [knowledge-store, model-gateway, parsing, blobs]

  extraction:
    title: Knowledge extraction
    layer: compile
    status: built
    runtime: node
    owns: Claims with verbatim evidence, fact-slot keys, reading by governance level and extract on use; facts a version stops stating, kept and marked, with a todo for their owner; how far each document's reading has come, paused at a spent budget or a model out of reach and resumed. Planned are entity resolution, SOPs from documents and approval mining, knowledge models, the artifact.dirty and comment.created subscriptions
    plugins: [migrations, model_mocks]
    publishes: [claims.updated, todo.requested]
    subscribes: [blocks.changed, artifact.dirty, comment.created]
    calls: [knowledge-store, model-gateway]

  freshness:
    title: Freshness engine
    layer: compile
    status: built
    runtime: node
    owns: Review clocks by knowledge class and plan day, staleness scores, copies and translations an edit left behind. Planned are the dependency graph and dirty marking with early cutoff (artifact.dirty), verification expiry
    plugins: [migrations]
    publishes: [artifact.dirty, review.due]
    subscribes: [blocks.changed, claims.updated]
    calls: [knowledge-store]

  governance:
    title: Governance agents
    layer: compile
    status: built
    runtime: node
    owns: Fact-slot values counted by independent source, the value that holds, conflict cases and todo requests from the deterministic tier, notes on values only reference documents state, daily rechecks of dated changes. Planned are the semantic, NLI and model-judge tiers (through model-gateway and agent-runtime), citation audit, claim merge (claims.updated), coverage gaps and the taxonomy gardener, each with a token budget
    plugins: [migrations]
    publishes: [todo.requested, claims.updated]
    subscribes: [claims.updated, todo.resolved]
    calls: [knowledge-store, model-gateway, agent-runtime]

  page-compiler:
    title: Page compiler
    layer: compile
    status: built
    runtime: node
    owns: Topics with stable keys and statement placements, re-clustered within a change budget and named by the model. Planned are cited page synthesis, diagram compilers, PageSpec output and page snapshots (page.rendered), the artifact.dirty subscription
    plugins: [migrations, model_mocks]
    publishes: [page.rendered]
    subscribes: [artifact.dirty, claims.updated]
    calls: [knowledge-store, model-gateway]

  collaboration:
    title: Collaboration and publishing
    layer: control
    status: built
    runtime: node
    owns: The inbox, with todos merged by dedupe key, routed to topic owners, on weekly cards within a budget; notes; first-review campaigns. Planned are comments and anchoring (comment.created), agent replies, overrides (claims.updated), the publish state machine (unit.published), quality gates, verification expiry, reacting to page.rendered, the source-restricted todo when a source later shares a published document more narrowly (acl.changed, whose ACL snapshots are advisory)
    plugins: [migrations]
    publishes: [comment.created, unit.published, todo.created, todo.resolved, claims.updated]
    subscribes: [page.rendered, comment.created, todo.requested, todo.created, review.due, acl.changed]
    calls: [knowledge-store, access-control, model-gateway, agent-runtime, retrieval]

  knowledge-store:
    title: Knowledge store
    layer: store
    status: built
    runtime: node
    owns: Schema, migrations, repository API, lineage, bitemporal reads, page snapshots, ACL snapshots, DataRef resolution (rows keep claim IDs for per-reader filtering), pgvector and pg_search index backends, and for now the chunk tables. Planned are entities, relations and procedures; handing the chunk tables and index backends to retrieval, which owns every index (adopted 2026-10-24)
    plugins: [migrations, vector_indexes, keyword_indexes]
    publishes: []
    subscribes: []
    calls: []

  retrieval:
    title: Retrieval and answers
    layer: serve
    status: built
    runtime: node
    owns: Chunks of every document with a contextual header, an embedding and its tenant's tokens, kept across versions; hybrid search (vector and keyword indexes, RRF), the reranker over statements and passages together, the permission pre-filter (spaces, clearance) and post-check; grounded answers that give the value governance holds, in the question's language, with notes on disputed and replaced values, read from the latest edition of a document the asker can read; questions searched in every pack language too; mature-RAG and long-context baselines to measure answers against, and a governed long context that reads everything the asker may read after governance. Planned are its own chunk tables and index backends, now in the knowledge store; page, procedure and entity indexes (claims.updated, artifact.dirty, page.rendered, unit.published), FAQ precompute and the semantic cache
    plugins: [migrations, model_mocks]
    publishes: []
    subscribes: [blocks.changed, claims.updated, artifact.dirty, page.rendered, unit.published]
    calls: [knowledge-store, access-control, model-gateway, governance, freshness]

  agent-api:
    title: Agent API
    layer: serve
    status: planned
    runtime: node
    owns: MCP server, REST and OpenAPI, Skills export, per-call audit
    plugins: []
    publishes: []
    subscribes: [unit.published]
    calls: [retrieval, knowledge-store, access-control]

  access-control:
    title: Access control
    layer: control
    status: built
    runtime: node
    owns: SpiceDB schema and graph, and an in-memory graph for tests; principal tokens verified against the business layer's published keys, with a development issuer for tests; visibility by space (a source's documents are readable by whoever may read its space; source ACLs decide nothing), space roles; the engine's copy of the business layer's directory (tenants, members) and the spaces with their owners and audiences, in its own schema (authz), granted in the graph to active members only; the derived-knowledge rule over lineage, search pre-filters, agent scopes; people and groups arrive from the business layer's directory. Planned are the personal space of the two-domain rule and the proof rule for jointly required inputs (adopted 2026-10-24), the oversharing scan, the audit log
    plugins: [migrations]
    publishes: []
    subscribes: []
    calls: [knowledge-store]

  model-gateway:
    title: Model gateway
    layer: control
    status: built
    runtime: node
    owns: Provider routing by sensitivity, budgets, prompt registry, response cache, cost metering; the HTTP service other runtimes call. Planned are web_search, an eval harness
    plugins: [migrations, model_providers]
    publishes: []
    subscribes: []
    calls: [blobs]

  agent-runtime:
    title: Agent runtime
    layer: control
    status: built
    runtime: node
    owns: The loop built-in agents run on (AgentSpec, tool registry, step and token limits, structured output) and their run traces; the gate every tool call passes, since a model chose it from content that may be hostile (operations the spec allows, validated arguments, read or propose only, a trace entry per call). No built-in agent runs on it yet. Planned are edits a member asked for (knowledge.write)
    plugins: [migrations]
    publishes: []
    subscribes: []
    calls: [model-gateway]

  research:
    title: Deep research runner
    layer: ingest
    status: planned
    runtime: node
    owns: Research agent over the agent API plus approved web search; emits conclusions, assumptions and evidence as a source
    plugins: []
    publishes: [source.changed]
    subscribes: [review.due]
    calls: [model-gateway, agent-runtime, blobs]

  views:
    title: Interactive views
    layer: serve
    status: planned
    runtime: node
    owns: ViewSpec and template registry (first 3 templates), the view generator agent, the headless Chromium render check (in the sandbox), view hosting on a separate origin; asks collaboration for view approval todos
    plugins: [view_templates]
    publishes: [todo.requested]
    subscribes: [page.rendered]
    calls: [knowledge-store, model-gateway, agent-runtime, sandbox, blobs]

  credential-broker:
    title: Credential broker
    layer: control
    status: planned
    runtime: node
    owns: Connections owned by a tenant or a member, secrets under per-tenant envelope encryption; the only refresher (proactive, single-flight per connection, a daily keep-alive; a failed refresh marks the connection for re-authorization and pauses its sources); short leases that carry only an access token (a tenant connection is never leased to an agent run); connection.changed comes with its contract
    plugins: [migrations]
    publishes: []
    subscribes: []
    calls: []

  sandbox:
    title: Sandbox
    layer: control
    status: planned
    runtime: node
    owns: Code we did not write, one container per job (read-only root, no volumes, an egress allow-list, never shared across tenants, nothing kept between jobs); profiles for vendor CLIs and MCP servers, used only for a vendor without a usable API and given a short-lived access token they never refresh, and for view render checks
    plugins: []
    publishes: []
    subscribes: []
    calls: [credential-broker, blobs]

# Shared libraries, not components (libs/<name>, published as @inspiration/<name>): any
# package may depend on them.
libraries:
  contracts:
    owns: Generated types and validators, the event catalogue, IDs, sensitivity labels, component interfaces
  kernel:
    owns: Settings, logging, plugin registry, SQL migrations runner, blob store, database pools, language packs, signed tokens (EdDSA JWTs both layers use)
  eventbus:
    owns: Postgres outbox, relay to Valkey Streams, consumer groups with retries and dead letters, in-memory bus for tests
  testkit:
    owns: Test fixtures for the compose stack (a migrated database per test, Valkey prefixes, SpiceDB settings) and test data files; test code only

# Business-layer components (business/<name>, published as @inspiration/<name>): people,
# companies, policy and the web app's backend, above the engine (docs/design/business-layer.md).
# A business package depends on the libraries and on the business components in its `calls`;
# `engine` there means the engine's HTTP API, through the client the app wires in. Nothing in
# engine/ or libs/ depends on a business package, and engine packages never import the
# business contracts (@inspiration/contracts/business).
business:
  accounts:
    title: Accounts
    status: built
    owns: Users (the account, usr_ IDs that never reach the engine), their login identities through the identity provider over OIDC (Logto, email and password), sessions, and the account's language. Planned are identity linking, sign-in policy per company, and deleting an account
    calls: []
  tenancy:
    title: Tenancy
    status: built
    owns: Companies (tenants) and their members, the one rule that assigns member IDs, the product roles super admin and member, and invite links; the sample company's visitors; provisions tenants and members in the engine as a service. Planned are joining by verified email domain, transfers from the personal library, and offboarding with handovers
    calls: [engine]

# Composition roots: deployable processes that wire components to the store, the bus and
# the blob store (apps/<name>, published as @inspiration/<name>). An app may depend on any
# component or library. No package depends on an app, except a harness that measures one:
# it lists that app under `uses`.
apps:
  engine:
    owns: The engine process; corpus manifests and topic owners, standing in for the business layer's provisioning, which they send through access control's directory; its HTTP API, version 0 (pnpm engine serve), with the routes for provisioning tenants and members, for administering spaces and for uploading files, whose reading runs in the background
  business:
    owns: The business backend, the browser's only server (pnpm business serve); the browser API for sign-in, companies, members and invite links over accounts and tenancy; the sample company, read only; principal tokens and their JWKS; the engine's provisioning and its /v0 API passed on as the member; the built web app
  web:
    owns: The product web app (React, Vite) over the business backend's browser API and, through it, the engine's HTTP API; signing in, the account menu and a first company; the admin area for a company's members, invite links and spaces with their space owners, and joining by a link; who reads a space, for its space owners; uploads of files and folders into a space, and new versions; how far each document is read, followed while the engine reads; opening the sample company, which only reads, and making a company from it; its language packs, and a development stand-in for the business backend; the demo (pnpm demo) and its recorded page (pnpm snapshot). Planned are Decide for me, Apps with access and the usage page
  bench:
    owns: The measurement harness and its CLI (pnpm bench); ingest runs and volume reports, the control check, history replay, questions and answers, the evidence audit, the reading check, cost, synthetic corpora
    uses: [engine]
  site:
    owns: The product website (pnpm site); static pages in English, Chinese and Japanese from language packs, a figure of the kinds of source it reads, scripted demos of the product (its search box and its window), measured results from the validation runs, and no download or sign-up while in development; .github/workflows/site.yml publishes it to GitHub Pages
