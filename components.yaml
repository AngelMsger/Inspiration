# Component manifest: who owns what, which events each component publishes and consumes,
# which synchronous APIs it may call, and which plugin groups it provides. test/manifest.test.ts
# checks it against the event catalogue, the plugin groups and the workspace packages.
# Each section has its own top-level directory: components in engine/, libraries in libs/,
# apps in apps/; business-layer packages go in business/, and engine/ and libs/ never
# depend on them.
#
# Every component is named for what it does. The name is also its package
# (engine/<name>, published as @inspiration/<name>), its event producer name, its
# consumer group and the first part of its model task names (<name>.<verb_object>).
#
# layer:     ingest | compile | store | serve | control (see docs/architecture.md)
# status:    built = in the workspace with tests; planned = not started;
#            in_progress = someone is building it (put the branch in `owner`).
# runtime:   node (a TypeScript package) or python (a worker behind an HTTP contract).
# plugins:   plugin groups the component's package declares, migrations included.
# calls:     the only synchronous dependencies allowed: other components, or `blobs`
#            (the kernel's blob store). A built component's package may depend on the
#            libraries below and on the components it calls, nothing else.
#
# Engine only: people, tenants, sign-in, publishing policy and the web app belong to the
# business layer, which calls the engine and consumes its events (docs/architecture.md).

components:
  connectors:
    title: Connector SDK and connectors
    layer: ingest
    status: built
    runtime: node
    owns: One integration per vendor (Feishu first) for sync and agent tools alike, a typed client over the vendor's API with one scope set and one rate budget per connection and a share kept for interactive tool calls; enumeration, fetch, ACL read, webhooks; Feishu docs, wiki, approval and upload connectors; registered queries for QueryData. Planned on the same client are agent tools (agent_tools plugins), each acting as the member with the member's own connection, and credentials only as leases from the credential broker
    plugins: [connectors]
    publishes: [source.changed]
    subscribes: []
    calls: [blobs]

  source-sync:
    title: Source sync
    layer: ingest
    status: built
    runtime: node
    owns: Cursors, 15-minute polls, nightly reconcile, rate budgets, subscription upkeep, debounce; stores source versions and ACL snapshots
    plugins: [migrations]
    publishes: [source.changed, document.fetched, acl.changed]
    subscribes: [source.changed]
    calls: [knowledge-store, blobs]

  parsing:
    title: Document parsing worker
    layer: ingest
    status: planned
    runtime: python
    owns: Stateless Office, PDF, scan and Excel parsing into normalized blocks with anchors, behind an HTTP contract; called by normalization, subscribes to nothing
    plugins: [parsers]
    publishes: []
    subscribes: []
    calls: [model-gateway, blobs]

  normalization:
    title: Normalization
    layer: ingest
    status: built
    runtime: node
    owns: Parser routing (built-in text parsers, the parsing worker for Office, PDF and scans), canonical blocks and spans with stable IDs, block diff against the previous version, duplicate documents and editions of one document
    plugins: [parsers, migrations]
    publishes: [blocks.changed]
    subscribes: [document.fetched]
    calls: [knowledge-store, model-gateway, parsing, blobs]

  extraction:
    title: Knowledge extraction
    layer: compile
    status: built
    runtime: node
    owns: Claims with evidence, entity resolution, SOPs from documents and approval mining, knowledge models
    plugins: [migrations, model_mocks]
    publishes: [claims.updated, todo.requested]
    subscribes: [blocks.changed, artifact.dirty, comment.created]
    calls: [knowledge-store, model-gateway]

  freshness:
    title: Freshness engine
    layer: compile
    status: built
    runtime: node
    owns: Dependency graph, dirty marking with early cutoff, staleness scores, TTL and assumption schedulers, copies an edit left behind
    plugins: [migrations]
    publishes: [artifact.dirty, review.due]
    subscribes: [blocks.changed, claims.updated]
    calls: [knowledge-store]

  governance:
    title: Governance agents
    layer: compile
    status: built
    runtime: node
    owns: Conflict tiers and judge, citation audit, claim merge, coverage gaps, taxonomy gardener, each with a token budget
    plugins: [migrations]
    publishes: [todo.requested, claims.updated]
    subscribes: [claims.updated]
    calls: [knowledge-store, model-gateway, agent-runtime]

  page-compiler:
    title: Page compiler
    layer: compile
    status: built
    runtime: node
    owns: Taxonomy clustering with stable keys and statement placements, cited page synthesis, diagram compilers, PageSpec output and page snapshots
    plugins: [migrations, model_mocks]
    publishes: [page.rendered]
    subscribes: [artifact.dirty, claims.updated]
    calls: [knowledge-store, model-gateway]

  collaboration:
    title: Collaboration and publishing
    layer: control
    status: built
    runtime: node
    owns: The inbox (todos merged by dedupe key, routed to topic owners, on weekly cards within a budget; notes; first-review campaigns), comments and anchoring, agent replies, overrides, publish state machine, quality gates, verification expiry
    plugins: [migrations]
    publishes: [comment.created, unit.published, todo.created, claims.updated]
    subscribes: [page.rendered, comment.created, todo.requested, todo.created, review.due]
    calls: [knowledge-store, access-control, model-gateway, agent-runtime, retrieval]

  knowledge-store:
    title: Knowledge store
    layer: store
    status: built
    runtime: node
    owns: Schema, migrations, repository API, lineage, bitemporal reads, page snapshots, ACL snapshots, DataRef resolution (rows keep claim IDs for per-reader filtering), pgvector and pg_search index backends
    plugins: [migrations, vector_indexes, keyword_indexes]
    publishes: []
    subscribes: []
    calls: []

  retrieval:
    title: Retrieval and answers
    layer: serve
    status: built
    runtime: node
    owns: Chunks of every document with a contextual header, an embedding and ACL tokens, kept across versions; hybrid search (vector and keyword indexes, RRF), the reranker over statements and passages together, ACL pre-filter and post-check; grounded answers that give the value governance holds, in the question's language, with notes on disputed and replaced values, read from the latest edition of a document the asker can read; plain-retrieval and long-context baselines to measure answers against. Planned are page, procedure and entity indexes (claims.updated, artifact.dirty, page.rendered, unit.published), FAQ precompute and the semantic cache
    plugins: [migrations, model_mocks]
    publishes: []
    subscribes: [acl.changed, blocks.changed, claims.updated, artifact.dirty, page.rendered, unit.published]
    calls: [knowledge-store, access-control, model-gateway, governance, freshness]

  agent-api:
    title: Agent API
    layer: serve
    status: planned
    runtime: node
    owns: MCP server, REST and OpenAPI, Skills export, per-call audit
    plugins: []
    publishes: []
    subscribes: [unit.published]
    calls: [retrieval, knowledge-store, access-control]

  access-control:
    title: Access control
    layer: control
    status: built
    runtime: node
    owns: SpiceDB schema and graph, source ACL mirroring, the derived-knowledge rule, search pre-filters, oversharing scan, audit log; people and groups arrive from the business layer's directory
    plugins: []
    publishes: []
    subscribes: [acl.changed]
    calls: [knowledge-store]

  model-gateway:
    title: Model gateway
    layer: control
    status: built
    runtime: node
    owns: Provider routing by sensitivity, budgets, prompt registry, response cache, cost metering, eval harness; the HTTP service other runtimes call
    plugins: [migrations, model_providers]
    publishes: []
    subscribes: []
    calls: [blobs]

  agent-runtime:
    title: Agent runtime
    layer: control
    status: built
    runtime: node
    owns: The loop built-in agents run on (AgentSpec, tool registry, step and token limits, structured output) and their run traces; the gate every tool call passes, since a model chose it from content that may be hostile (operations the spec allows, validated arguments, read or propose only, a trace entry per call)
    plugins: [migrations]
    publishes: []
    subscribes: []
    calls: [model-gateway]

  research:
    title: Deep research runner
    layer: ingest
    status: planned
    runtime: node
    owns: Research agent over the agent API plus approved web search; emits conclusions, assumptions and evidence as a source
    plugins: []
    publishes: [source.changed]
    subscribes: [review.due]
    calls: [model-gateway, agent-runtime, blobs]

  views:
    title: Interactive views
    layer: serve
    status: planned
    runtime: node
    owns: ViewSpec and template registry (first 3 templates), the view generator agent, the headless Chromium render check (in the sandbox), view hosting on a separate origin; asks collaboration for view approval todos
    plugins: [view_templates]
    publishes: [todo.requested]
    subscribes: [page.rendered]
    calls: [knowledge-store, model-gateway, agent-runtime, sandbox, blobs]

  credential-broker:
    title: Credential broker
    layer: control
    status: planned
    runtime: node
    owns: Connections owned by a tenant or a member, secrets under per-tenant envelope encryption; the only refresher (proactive, single-flight per connection, a daily keep-alive; a failed refresh marks the connection for re-authorization and pauses its sources); short leases that carry only an access token (a tenant connection is never leased to an agent run); connection.changed comes with its contract
    plugins: [migrations]
    publishes: []
    subscribes: []
    calls: []

  sandbox:
    title: Sandbox
    layer: control
    status: planned
    runtime: node
    owns: Code we did not write, one container per job (read-only root, no volumes, an egress allow-list, never shared across tenants, nothing kept between jobs); profiles for vendor CLIs and MCP servers, used only for a vendor without a usable API and given a short-lived access token they never refresh, and for view render checks
    plugins: []
    publishes: []
    subscribes: []
    calls: [credential-broker, blobs]

# Shared libraries, not components (libs/<name>, published as @inspiration/<name>): any
# package may depend on them.
libraries:
  contracts:
    owns: Generated types and validators, the event catalogue, IDs, sensitivity labels, component interfaces
  kernel:
    owns: Settings, logging, plugin registry, SQL migrations runner, blob store, database pools, language packs
  eventbus:
    owns: Postgres outbox, relay to Valkey Streams, consumer groups with retries and dead letters, in-memory bus for tests
  testkit:
    owns: Test fixtures for the compose stack (a migrated database per test, Valkey prefixes, SpiceDB settings) and test data files; test code only

# Composition roots: deployable processes that wire components to the store, the bus and
# the blob store (apps/<name>, published as @inspiration/<name>). An app may depend on any
# component or library. No package depends on an app, except a harness that measures one:
# it lists that app under `uses`.
apps:
  engine:
    owns: The engine process; corpus manifests, standing in for the business layer's provisioning
  bench:
    owns: The measurement harness and its CLI (pnpm bench); ingest runs and volume reports, the control check, history replay, questions and answers, the reading check, cost, synthetic corpora
    uses: [engine]
