# Model gateway config for validation runs on DeepSeek V4.1 Flash (docs/design/validation.md,
# "Cost, and how it stays low"). Run with `pnpm bench ingest <corpus> --gateway
# config/gateway.deepseek.yaml`, and first with --dry-run: the same config with stand-ins for
# every provider, which meters what the run would send and prices it here, without a key.
# A real run needs the local model server (infra/local-embeddings) running.
#
# The model ID is the one GET /v1/models lists. The prices are peak prices from third-party
# reports; the first run (apps/bench/runs/2026-10-27-deepseek.md) measured about half of them
# off-peak, from the account's balance: CNY 1 per million input tokens, 4 per million output
# and about 0.02 per million cached input. Peak is reported as weekdays 01-04 and 06-10 UTC,
# so full runs go off-peak.
currency: USD

providers:
  - name: deepseek
    kind: openai_compatible
    base_url: https://api.deepseek.com/v1
    # Provider keys carry an INSPIRATION_ prefix in the environment that runs the bench.
    api_key_env: INSPIRATION_DEEPSEEK_API_KEY
    # A cloud API: never sees confidential or secret content.
    max_sensitivity: internal
    timeout_s: 300
    models:
      - name: deepseek-flash
        operations: [complete]
        tiers: [flash, standard, flagship]
        # JSON mode only: the gateway puts the schema in the prompt and checks the reply.
        json_schema: false
        # The model thinks by default, which bills its reasoning as output and slows each call.
        # Off, as in the dry run's estimate; a reading run with thinking on is a separate test.
        request: {thinking: {type: disabled}}
        price: {input: 0.30, output: 1.20, cached_input: 0.006}

  # DeepSeek has no embedding, rerank or OCR models. Vectors and rerank scores come from open
  # multilingual models on this machine (infra/local-embeddings: start it first), because the
  # stand-ins' hashed words cannot match a Chinese question with an English sentence. Runs
  # here see everything, so these providers may too.
  - name: embeddings
    kind: openai_compatible
    base_url: http://127.0.0.1:8090/v1
    max_sensitivity: secret
    timeout_s: 900
    max_retries: 0
    models:
      - name: qwen3-embedding-0.6b
        operations: [embed]
        dimensions: 1024
        query_instruction: Given a question, retrieve passages that answer it

  # A cross-encoder that reads the question with each passage, in any of the languages; the
  # stand-in's word overlap put passages that answer a question in another language below ones
  # that only share its words (apps/bench/runs/2026-10-27-search.md). On this machine's 4 CPUs it
  # reads about 1,000 tokens a second, some 12 seconds for one question's candidates
  # (apps/bench/runs/2026-10-28-rerank.md); a GPU server should take well under a second.
  - name: reranker
    kind: openai_compatible
    base_url: http://127.0.0.1:8090/v1
    max_sensitivity: secret
    timeout_s: 900
    max_retries: 2
    models:
      - name: bge-reranker-v2-m3
        operations: [rerank]

  # No chat model here: a confidential completion fails rather than being answered by a
  # stand-in.
  - name: local
    kind: fake
    max_sensitivity: secret
    models:
      - {name: fake-ocr, operations: [ocr]}

budgets:
  # The prepaid balance is the hard cap. Inside it this is a soft stop for all the run's calls
  # together: a call is refused once the day's spend, with what calls in flight in this process
  # hold, reaches the limit. A call let in under it can cost more than it held (a schema retry,
  # a dearer fallback), and other processes count once they have metered, so a day may exceed
  # it by an amount only the balance bounds. A run on a database (--stack) counts the day's
  # earlier runs too.
  - match: "*"
    period: day
    limit: 5
    pooled: true

cache:
  # Shared by runs, so a change to answering alone does not read the corpus again.
  backend: valkey
  ttl_s: 2592000
  # Embeddings and rerank scores too: each text is cached on its own, and the local models on
  # CPU take about half an hour to embed the company drive and as long to rerank the passages
  # of its 150 questions.
  operations: [complete, embed, rerank]
