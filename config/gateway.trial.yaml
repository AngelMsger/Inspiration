# Model gateway config for the MVP trial (docs/design/mvp.md, "The trial's model budget"): the
# companies that sign up read their documents and get their answers on DeepSeek, within CNY 100
# a month for the whole trial and a day budget per company. Run the engine with
# `pnpm engine serve examples/corpus --gateway config/gateway.trial.yaml --valkey <url>
# --usage <postgres url> --corpus-gateway config/gateway.demo.yaml ...`, so the sample company
# keeps the models its story rests on. Its calls count against the budgets below as well, in
# the one usage ledger that --usage keeps in Postgres, so a restart spends nothing twice; the
# server will not start without it. Embeddings and rerank scores come from the local model
# server (infra/local-embeddings), which must be running; the work on fast answers may change
# them.
#
# Prices are DeepSeek's peak prices in CNY, twice what the first run measured off-peak
# (apps/bench/runs/2026-10-27-deepseek.md), so the budgets stop early rather than late.
currency: CNY

providers:
  - name: deepseek
    kind: openai_compatible
    base_url: https://api.deepseek.com/v1
    api_key_env: INSPIRATION_DEEPSEEK_API_KEY
    # A cloud API: confidential and secret content has no model in the trial.
    max_sensitivity: internal
    timeout_s: 120
    models:
      - name: deepseek-flash
        operations: [complete]
        tiers: [flash, standard, flagship]
        json_schema: false
        request: {thinking: {type: disabled}}
        price: {input: 2.0, output: 8.0, cached_input: 0.04}

  # Inside the server: may see everything. Its models cost nothing per call.
  - name: local
    kind: openai_compatible
    base_url: http://127.0.0.1:8090/v1
    max_sensitivity: secret
    timeout_s: 300
    max_retries: 2
    models:
      - name: qwen3-embedding-0.6b
        operations: [embed]
        dimensions: 1024
        query_instruction: Given a question, retrieve passages that answer it
      - name: bge-reranker-v2-m3
        operations: [rerank]

# A call must fit every budget whose glob matches its key.
budgets:
  # Reading, per company and day: a governed document of about 3,000 tokens costs about
  # CNY 0.02 to read, so a company reads about 150 a day; reading pauses there and carries on
  # the next day.
  - match: "tenant:*/extraction"
    period: day
    limit: 3
  # Answers, per company and day: about 800 compact answers at these prices.
  - match: "tenant:*/retrieval"
    period: day
    limit: 2
  # Naming topics, per company and day.
  - match: "tenant:*/page-compiler"
    period: day
    limit: 0.5
  # The whole trial, every company together.
  - match: "*"
    period: month
    limit: 100
    pooled: true

cache:
  backend: valkey
  ttl_s: 2592000
  operations: [complete, embed, rerank]
