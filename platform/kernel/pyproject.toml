[project]
name = "inspiration-kernel"
version = "0.1.0"
description = "Shared runtime: settings, plugin registry, SQL migrations, blob store"
requires-python = ">=3.12"
dependencies = [
  "inspiration-contracts",
  "psycopg[binary,pool]>=3.2",
  "pydantic-settings>=2.6",
]

[project.scripts]
inspiration-migrate = "inspiration.kernel.migrate:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inspiration"]

[tool.uv.sources]
inspiration-contracts = { workspace = true }
