# What the assistant writes in Japanese; see en.yaml.
reasons:
  changed: 日付のある変更がすでに有効になり、もう一方の値を置き換えました。
  authority: 最も権威のある情報源がこの値を記載しています。
  disagreement: ガバナンスはこの値を提案していますが、同じくらい権威のある情報源が別の値を記載しています。
  note: もう一方の値を記載しているのは参考文書だけで、管理対象の値は引き続き有効です。
  unchanged: 文書は見直し期間中に変更されていません。このレビューは期限が来ただけです。
  copy: このコピーが写している文書が変更され、ガバナンスは変更後の文書の値を優先しています。
left:
  unsure: 同じくらい権威のある情報源の内容が食い違っているため、あなたが選んでください。
  person_decided: 以前この問題で別の選択をした人がいるため、あなたに残しました。
  never: アシスタントはこの種類のタスクを代わりに決めません。
  no_advice: 今のところ提案できることがありません。
  with_conflict: 同じカードの競合が決まるのを待っています。
  undone: アシスタントの決定をあなたが取り消しました。
labels:
  acknowledged: 確認済み
  reviewed: レビュー済み
