<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" lang="en" role="img" aria-labelledby="t d">
<title id="t">Right more often, reading far less</title>
<desc id="d">Decisive test · 276 questions on 92 facts, asked in English, Chinese and Japanese · DeepSeek V4.1 Flash, thinking off. Mature RAG: 234 / 276, 8,954 input tokens per answer; Inspiration: 248 / 276, 5,024 input tokens per answer; Inspiration, compact answer: 242 / 276, 1,961 input tokens per answer; Long context, whole topic: 252 / 276, 202,402 input tokens per answer; Long context, governed: 257 / 276, 206,884 input tokens per answer. Lab results on one corpus of real public text, and the governance rules were refined on it. Method and caveats: docs/design/validation.md</desc>
