<title id="t">答得更准，读得更少</title>
<desc id="d">决定性测试 · 92 条事实、276 个问题，用英文、中文和日文各问一遍 · DeepSeek V4.1 Flash，不开思考. 成熟 RAG: 234 / 276, 8,954 每次回答的输入 token; Inspiration: 248 / 276, 5,024 每次回答的输入 token; Inspiration 精简回答: 242 / 276, 1,961 每次回答的输入 token; 原始长上下文（整个话题）: 252 / 276, 202,402 每次回答的输入 token; 治理后的长上下文: 257 / 276, 206,884 每次回答的输入 token. 实验室结果：一套真实公开文本的语料，治理规则也是在这套语料上改进的。方法与局限见 docs/design/validation.md</desc>
