<style>

  --bg: #F3F5F3; --surface: #FFFFFF; --sunk: #E9EDEA; --band: #EDF1EE;

  --agent: #A3456B; --agent-soft: #F7E6ED;
  --planned: #9AA6A1;
  --font-sans: "IBM Plex Sans", "Noto Sans SC", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", "Noto Sans SC", ui-monospace, monospace;
}
html[lang="ja"] { --font-sans: "IBM Plex Sans", "Noto Sans JP", system-ui, sans-serif; --font-mono: "IBM Plex Mono", "Noto Sans JP", ui-monospace, monospace; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-sans); font-size: 14px; }
#fig { width: 1206px; padding: 16px; background: var(--bg); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.key { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12.5px; }
svg#dia { display: block; width: 1174px; height: auto; }
.col-band { fill: var(--band); }
.col-label { fill: var(--faint); font-size: 12px; font-weight: 500; letter-spacing: .08em; }
.node .box { fill: var(--surface); stroke: var(--line); stroke-width: 1.25; }
.node.ext .box { fill: none; stroke: var(--ext); stroke-dasharray: 5 4; }
.node.oss .box { fill: var(--oss); stroke: var(--oss-line); }
.node.planned .box { stroke: var(--planned); stroke-dasharray: 6 4; stroke-width: 1.4; }
.node.oss.planned .box { fill: #EEF2F6; }
.node .tag { font-family: var(--font-mono); font-size: 11.5px; font-weight: 500; fill: var(--event); }
.node.ext .tag { fill: var(--ext); font-family: var(--font-sans); }
.node.oss .tag { fill: var(--oss-ink); font-family: var(--font-sans); }
.node.planned .tag { fill: var(--faint); }
.node .name { fill: var(--ink); font-size: 14.5px; font-weight: 600; }
.node .desc { fill: var(--muted); font-size: 12px; }
.chip rect { fill: var(--sunk); }
.chip text { fill: var(--muted); font-size: 10.5px; }
.chip.agent rect { fill: var(--agent-soft); stroke: var(--agent); stroke-width: 1; }
.chip.agent text { fill: var(--agent); font-weight: 500; }
.pgrow rect { fill: var(--surface); stroke: var(--oss-line); stroke-width: 1; }
.pgrow text { fill: var(--ink); font-size: 12px; }
.edge .ln { fill: none; stroke-width: 1.6; }
.edge.event .ln { stroke: var(--event); }
.edge.sync .ln { stroke: var(--sync); stroke-dasharray: 6 4; }
.edge.ext .ln { stroke: var(--ext); stroke-dasharray: 3 4; }
.edge .lbl { font-family: var(--font-mono); font-size: 11px; }
.edge.event .lbl { fill: var(--event); }
.edge.sync .lbl { fill: var(--sync); }
.edge.ext .lbl { fill: var(--ext); }
.edge .lbl-bg { fill: var(--surface); }
.deploy rect { fill: var(--sunk); }
.deploy .k { fill: var(--muted); font-size: 12px; font-weight: 600; }
.deploy .v { fill: var(--ink); font-size: 12px; }
.band-note { fill: var(--faint); font-size: 11.5px; }
</style>
</head>

  const edgeLayer = el("g", {}, svg);
  E.forEach(e => {
    const g = el("g", { class: `edge ${e.k}` }, edgeLayer);
    el("path", { d: roundPath(e.pts), class: "ln", "marker-end": `url(#arr-${e.k})` }, g);
    if (e.label && e.l) e.lblNode = txt(g, e.l[0], e.l[1], t(e.label), "lbl", e.l[2]);
    e.g = g;
  });

  const nodeLayer = el("g", {}, svg);
  for (const [k, n] of Object.entries(N)) {
    const w = n.w || W, h = n.h || H;
    const g = el("g", { class: `node ${n.kind}${n.planned ? " planned" : ""}` }, nodeLayer);
    el("rect", { x: n.x, y: n.y, width: w, height: h, rx: 10, class: "box" }, g);
    const nameNode = txt(g, n.x + 12, n.y + 24, t(n.name), "name");
    const tag = lang === "en" || n.apps ? "" : n.comps ? (n.comps.length === 1 ? n.comps[0] : t([`${n.comps.length} components`, `${n.comps.length} 个组件`, `${n.comps.length} 部品`])) : t(n.kind === "ext" ? OUT : OSS);
    if (tag) {
      const tagNode = txt(g, n.x + w - 12, n.y + 24, tag, "tag", "end");
      tags.push([nameNode, tagNode, w]);
    }
    fit(nameNode, w - 24, k + " name");
    if (n.rows) {
      PG_ROWS.forEach((r, j) => {
        const ry = n.y + 38 + j * 29;
        const rg = el("g", { class: "pgrow" }, g);
        el("rect", { x: n.x + 10, y: ry, width: w - 20, height: 23, rx: 5 }, rg);
        fit(txt(rg, n.x + 18, ry + 16, t(r), ""), w - 36, k);
      });
    } else {
      const lines = t(n.lines) || [];
      if (lines[0]) fit(txt(g, n.x + 12, n.y + 46, lines[0], "desc"), w - 22, k);
      if (n.chips && n.chips.length) {
        let cx = n.x + 12;
        n.chips.forEach(c => {
          const label = t(c);
          const cg = el("g", { class: "chip" + (c === "Agent" ? " agent" : "") }, g);
          const ct = txt(cg, 0, n.y + 67.5, label, "", "middle");
          const cw = ct.getComputedTextLength() + 14;
          el("rect", { x: cx, y: n.y + 56, width: cw, height: 16, rx: 8 }, cg);
          ct.setAttribute("x", cx + cw / 2);
          cg.appendChild(ct);
          cx += cw + 6;
        });
      } else if (lines[1]) fit(txt(g, n.x + 12, n.y + 66, lines[1], "desc"), w - 22, k);
    }
  }

  document.fonts.ready.then(() => {
    for (const [nameNode, tagNode, w] of tags) if (nameNode.getComputedTextLength() > w - 32 - tagNode.getComputedTextLength()) tagNode.remove();
    E.forEach(e => {
      if (!e.lblNode) return;
      const b = e.lblNode.getBBox();
      const r = el("rect", { x: b.x - 3, y: b.y - 1, width: b.width + 6, height: b.height + 2, rx: 3, class: "lbl-bg" });
      e.g.insertBefore(r, e.lblNode);
    });
    window.OVERFLOW = fits.map(([node, max, what]) => [node, typeof max === "function" ? max() : max, what]).filter(([node, max]) => node.getComputedTextLength() > max).map(([node, max, what]) => `${what}: "${node.textContent}" ${Math.round(node.getComputedTextLength())} > ${Math.round(max)}`);
    document.body.dataset.ready = "1";
  });
})();
</script>
</body>
</html>
