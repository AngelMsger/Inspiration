<title id="t">より正確に、より少なく読む</title>
<desc id="d">決定的テスト · 92 件の事実を英語・中国語・日本語で問う 276 問 · DeepSeek V4.1 Flash、思考オフ. 成熟した RAG: 234 / 276, 8,954 1 回答あたりの入力トークン; Inspiration: 248 / 276, 5,024 1 回答あたりの入力トークン; Inspiration 簡潔回答: 242 / 276, 1,961 1 回答あたりの入力トークン; ロングコンテキスト（全文）: 252 / 276, 202,402 1 回答あたりの入力トークン; ガバナンス後のロングコンテキスト: 257 / 276, 206,884 1 回答あたりの入力トークン. 実在の公開テキストによる 1 つのコーパスでの実験結果で、ガバナンスのルールもこのコーパスで改良しました。方法と限界は docs/design/validation.md</desc>
