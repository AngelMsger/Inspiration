# Chinese cases for the extraction mock (mock.test.ts). Each language file has the same
# fields; see en.yaml for what each one checks.

vocabulary:
  predicates:
    - predicate: hotel_cap_per_night
      label: 住宿限额（每晚）
      knowledge_class: policy
      aliases: [住宿]
      qualifiers:
        - { name: 一线城市, aliases: [一线城市, 北京] }
        - { name: 新一线城市, aliases: [新一线城市, 成都] }
      value: { kind: money, unit: CNY/night, currency: CNY, words: [元] }
    - predicate: travel_claim_deadline_days
      label: 差旅报销时限
      knowledge_class: policy
      aliases: [报销申请, 天内报销]
      value: { kind: duration, unit: day, words: [日, 天] }
    - predicate: payment_day
      label: 报销付款日
      aliases: [报销款]
      value: { kind: enum, values: [每周三, 每周五] }

values:
  - text: 工作满 1 年不满 10 年的，出差结束后 30 日内报销。
    predicate: travel_claim_deadline_days
    value: { number: 30 }
  - text: 每晚 600 元。
    predicate: hotel_cap_per_night
    value: { kind: money, number: 600, unit: CNY/night, currency: CNY, normalized: 600 CNY/night }
  - text: 住宿费凭发票报销。
    predicate: hotel_cap_per_night
    value: null
  # "1 日" is a calendar day, not a time limit.
  - text: 自 2026 年 7 月 1 日起，出差结束后 60 天内报销。
    predicate: travel_claim_deadline_days
    value: { number: 60 }
  - text: 自 2026 年 7 月 1 日起，
    predicate: travel_claim_deadline_days
    value: null
  - text: 北京每晚 1,200 元。
    predicate: hotel_cap_per_night
    value: { number: 1200 }
  - text: 审批通过的报销款于每周三统一支付。
    predicate: payment_day
    value: { kind: enum, text: 每周三, normalized: 每周三 }

effective:
  - { text: 自 2026 年 10 月 1 日起，住宿限额调整为每晚 650 元。, day: "2026-10-01" }
  - { text: 2027-01-15 起执行。, day: "2027-01-15" }
  - { text: 2026 年 9 月 28 日, day: null }

change: { title: 经营会纪要, date: "2026-09-26", heading: [决议], text: 一线城市住宿限额调整为每晚 650 元。 }

plans:
  - { text: 王伟负责接口联调，预计 2026 年 11 月 20 日完成。, day: "2026-11-20" }
  - { text: 预计 3 月 5 日上线。, document_date: "2027-01-10", day: "2027-03-05" }
  - { text: 预计 3 月 5 日上线。, day: null }

plan: { title: 星火项目周报, date: "2026-10-19", text: 预计 12 月 1 日完成灰度发布。, day: "2026-12-01" }

window:
  title: 差旅
  spans: [新一线城市住宿限额为每晚 450 元。, 住宿要提前订吗？, 谢谢大家。, 研发部 2027 年计划招聘 40 人。]
  claims:
    - [s1, rule, "hotel_cap_per_night|新一线城市"]
    - [s4, plan, null]

clauses:
  text: 一线城市住宿限额为每晚 650 元，新一线城市每晚 450 元。
  statements: [一线城市住宿限额为每晚 650 元。, 住宿限额（每晚）：新一线城市每晚 450 元。]
  qualifiers: [一线城市, 新一线城市]

rows:
  - title: 城市住宿标准.csv
    header: [城市, 等级, 住宿限额（元/晚）]
    cells: [北京, 一线城市, "600"]
    statement: 城市：北京，等级：一线城市，住宿限额（元/晚）：600。
    slot: "hotel_cap_per_night|一线城市"
    number: 600
  - title: 城市住宿标准.csv
    header: [城市, 每晚上限（元）]
    cells: [成都, "450"]
    statement: 城市：成都，每晚上限（元）：450。
    slot: "hotel_cap_per_night|新一线城市"
    number: 450
