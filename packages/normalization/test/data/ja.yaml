# Japanese cases for the normalization unit tests (units.test.ts).

passages:
  - text: "第1条 この規程は出張旅費について定める。第2条 宿泊費は1泊15000円以内とする。\n領収書を添付すること！"
    passages:
      - "第1条 この規程は出張旅費について定める。"
      - "第2条 宿泊費は1泊15000円以内とする。"
      - "領収書を添付すること！"
  - text: "「了解しました。」その後、彼は退室した。"
    passages: ["「了解しました。」", "その後、彼は退室した。"]
  - text: "注：\n領収書が必要です。"
    passages: ["注：\n領収書が必要です。"]

cut: { first: "あ", comma: "、", second: "い", stop: "。" }

fingerprint:
  article: "第{n}条 社員は会社の定める基準に従って宿泊費、交通費及び食費を精算し、超過分は自己負担とする。"
  reformat: ["、", "，"]
  edit: ["第3条", "第三条"]
  other: "会議室の予約は前日までに総務システムで申請し、参加人数と必要な機材を記入すること。"
