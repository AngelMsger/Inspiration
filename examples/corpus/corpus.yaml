# A small demo tenant for the ingest prototype: one fictional manufacturer (恒远机械) with
# the finance department's policies and team notes, the company-wide policies, an archive
# folder and Feishu fixtures. README.md lists the duplicates and conflicts planted in it.

tenant:
  id: ten_01HENGYUAN0000000000000001
  name: 恒远机械

# owner: the member who maintains the space (周敏 and 张敏 in people.yaml). readers: who reads
# it besides its owner; the whole tenant when not given. A space's audience decides who reads
# its documents, so the finance-only budget notes and the HR-only payroll policy have spaces of
# their own; the ACLs their folders carry are kept and decide nothing.
spaces:
  - id: spc_01HENGYUAN000000000FINANCE
    name: 财务部
    owner: mem_01HENGYUAN000000000ZHOUMIN
  - id: spc_01HENGYUAN0000000000POLICY
    name: 公司制度
    owner: mem_01HENGYUAN00000000ZHANGMIN
  - id: spc_01HENGYUAN0000000FINBUDGET
    name: 财务内部
    owner: mem_01HENGYUAN000000000ZHOUMIN
    readers:
      - mem_01HENGYUAN000000000000LINA
      - mem_01HENGYUAN000000000WANGLEI
      - mem_01HENGYUAN0000000000GAOYAN
      - mem_01HENGYUAN000000000LIUYANG
  - id: spc_01HENGYUAN000000HRPAYROLL
    name: 人事薪酬
    owner: mem_01HENGYUAN00000000ZHANGMIN
    readers: []

# The member questions are asked as: 陈晨, who reads what the whole tenant may.
reader: mem_01HENGYUAN00000000CHENCHEN

# What the business layer's directory would answer: the sources' own principal IDs mapped
# to engine principals. Unmapped entries stay in the ACL snapshot as they are.
directory:
  folder:
    group:finance: grp_01HENGYUAN000000000FINANCE
    group:hr: grp_01HENGYUAN000000000000000HR
    group:admin-office: grp_01HENGYUAN000000000000ADMIN
    user:li.na: mem_01HENGYUAN000000000000LINA
    user:wang.lei: mem_01HENGYUAN000000000WANGLEI
    user:zhou.min: mem_01HENGYUAN000000000ZHOUMIN
    user:gao.yan: mem_01HENGYUAN0000000000GAOYAN
    user:liu.yang: mem_01HENGYUAN000000000LIUYANG
    user:sun.qian: mem_01HENGYUAN000000000SUNQIAN
    user:zhang.min: mem_01HENGYUAN00000000ZHANGMIN
    user:lin.xiao: mem_01HENGYUAN000000000LINXIAO
    user:zhao.lin: mem_01HENGYUAN000000000ZHAOLIN
  feishu:
    department:od_finance: dep_01HENGYUAN000000000FINANCE
    department:od_admin: dep_01HENGYUAN000000000000ADMIN
    user:ou_li_na: mem_01HENGYUAN000000000000LINA
    user:ou_wang_lei: mem_01HENGYUAN000000000WANGLEI
    user:ou_gao_yan: mem_01HENGYUAN0000000000GAOYAN
    user:ou_liu_yang: mem_01HENGYUAN000000000LIUYANG
    user:ou_chen_chen: mem_01HENGYUAN00000000CHENCHEN

sources:
  - id: src_01HENGYUAN0000000FINPOLICY
    type: folder
    space: spc_01HENGYUAN000000000FINANCE
    name: 财务制度
    root: 财务制度
    directory: folder
    default_authority: 0.9
    exclude: ["预算/内部/**"]
  - id: src_01HENGYUAN0000000FINBUDGET
    type: folder
    space: spc_01HENGYUAN0000000FINBUDGET
    name: 内部预算
    root: 财务制度/预算/内部
    directory: folder
    default_authority: 0.9
  - id: src_01HENGYUAN000000000FINTEAM
    type: folder
    space: spc_01HENGYUAN000000000FINANCE
    name: 财务团队
    root: 财务团队
    directory: folder
    default_authority: 0.5
  - id: src_01HENGYUAN000000000ARCHIVE
    type: folder
    space: spc_01HENGYUAN000000000FINANCE
    name: 历史归档
    root: 归档
    directory: folder
    default_authority: 0.3
  - id: src_01HENGYUAN0000000FEISHUDOC
    type: feishu.docx
    space: spc_01HENGYUAN000000000FINANCE
    name: 飞书知识库
    root: feishu
    directory: feishu
    default_authority: 0.6
    governance_level: reference
  - id: src_01HENGYUAN000000FEISHUFLOW
    type: feishu.approval
    space: spc_01HENGYUAN000000000FINANCE
    name: 飞书审批
    root: feishu
    directory: feishu
    default_authority: 0.7
    governance_level: governed
  - id: src_01HENGYUAN00000000POLICIES
    type: folder
    space: spc_01HENGYUAN0000000000POLICY
    name: 公司制度
    root: 公司制度
    directory: folder
    default_authority: 0.9
    exclude: ["人事/薪酬/**"]
  - id: src_01HENGYUAN000000HRPAYROLL
    type: folder
    space: spc_01HENGYUAN000000HRPAYROLL
    name: 薪酬
    root: 公司制度/人事/薪酬
    directory: folder
    default_authority: 0.9
