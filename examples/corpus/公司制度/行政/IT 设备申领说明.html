<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>IT 设备申领说明</title></head>
<body>
<h1>IT 设备申领说明</h1>
<p>新员工入职当天由 IT 部发放笔记本电脑一台。研发岗位配置 32G 内存机型，其他岗位配置 16G 内存机型。</p>
<h2>申领流程</h2>
<ol>
<li>在飞书审批中提交《IT 设备申领》。</li>
<li>直属上级审批。</li>
<li>IT 部在 3 个工作日内备货并通知领取。</li>
</ol>
<h2>更换周期</h2>
<table>
<tr><th>设备</th><th>更换周期</th></tr>
<tr><td>笔记本电脑</td><td>4 年</td></tr>
<tr><td>显示器</td><td>5 年</td></tr>
<tr><td>手机（仅销售岗）</td><td>3 年</td></tr>
</table>
<p>设备丢失的，须在 24 小时内报告 IT 部和信息安全组。</p>
</body></html>
