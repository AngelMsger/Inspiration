# The demo script: who does what, in order. pnpm snapshot records it (apps/web/src/snapshot.ts)
# and the snapshot's guide walks a visitor through it. `as` is the member who takes a step,
# `open` the page's address it starts at (one per language for a question, so the answer comes
# in the language the page shows), `text` what to look at or do, and `do` the action
# that moves the demo on: confirming the suggestion of the todo about a slot, or putting in an
# upstream edit from updates/.

steps:
  - as: mem_01HENGYUAN00000000CHENCHEN
    open:
      zh: /ask?q=去深圳出差住宿每晚能报多少？
      en: /ask?q=How much can I claim for a hotel night on a business trip to Shenzhen?
      ja: /ask?q=深圳出張のホテル代は1泊いくらまで精算できますか？
    text:
      zh: 销售部的陈晨要去深圳出差，问住宿能报多少。回答以王磊的《深圳协议酒店价目表》的 650 元为准，并提示各处说法不一：差旅制度第 6 版还写着 600 元，等负责人定。
      en: 陈晨 from Sales is going to Shenzhen and asks how much a hotel night may cost. The answer goes by the 650 in 王磊's Shenzhen hotel price list, and says the sources disagree; edition 6 of the travel policy still says 600 until its owner decides.
      ja: 営業部の陈晨が深圳出張を前に、1 泊いくらまで精算できるか尋ねます。回答は王磊の《深圳协议酒店价目表》の 650 元に拠り、出典によって食い違うこと、旅費規程の第 6 版はまだ 600 元で、責任者の判断待ちであることを伝えます。

  - as: mem_01HENGYUAN00000000CHENCHEN
    open: /document?source=src_01HENGYUAN0000000FINPOLICY&item=%E5%B7%AE%E6%97%85%2F%E5%B7%AE%E6%97%85%E6%8A%A5%E9%94%80%E7%AE%A1%E7%90%86%E5%8A%9E%E6%B3%95.md&view=annotated
    text:
      zh: 《差旅报销管理办法》第 6 版的标注视图。往下找到住宿费那张表，一线城市这一行标着有争议；点一下，右侧列出两种说法和各自的出处。
      en: Edition 6 of the travel policy in its Annotated view. Scroll to the hotel rate table; the tier-1 city row is marked disputed. Click it, and the right panel lists both values and where each comes from.
      ja: 《差旅报销管理办法》第 6 版の注釈ビューです。宿泊費の表までスクロールすると、一線都市の行に「争いあり」の印があります。クリックすると、右側に 2 つの値とそれぞれの出典が出ます。

  - as: mem_01HENGYUAN000000000000LINA
    open: /inbox
    text:
      zh: 李娜是差旅主题负责人。在待办里确认建议：一线城市每晚 650 元，以《深圳协议酒店价目表》为准。
      en: 李娜 owns the travel topic. In the inbox, confirm the suggestion that tier-1 cities get 650 a night, as the Shenzhen hotel price list says.
      ja: 李娜は出張トピックの責任者です。受信トレイで、一線都市は 1 泊 650 元、《深圳协议酒店价目表》に従うという提案を確定します。
    do:
      resolve: hotel_cap_per_night|一线城市

  - as: mem_01HENGYUAN00000000CHENCHEN
    open:
      zh: /ask?q=去深圳出差住宿每晚能报多少？
      en: /ask?q=How much can I claim for a hotel night on a business trip to Shenzhen?
      ja: /ask?q=深圳出張のホテル代は1泊いくらまで精算できますか？
    text:
      zh: 切回陈晨再问一次：答案按李娜的决定，答疑和会议纪要里还写着的 600 元都标为已过时。
      en: Back as 陈晨, ask again. The answer follows 李娜's decision, and the 600 that the FAQ and the meeting notes still give reads as outdated.
      ja: 陈晨に戻ってもう一度尋ねます。回答は李娜の決定に従い、FAQ や議事録にまだある 600 元は古い値として示されます。

  - as: mem_01HENGYUAN000000000ZHOUMIN
    open: /spaces/spc_01HENGYUAN000000000FINANCE/maintain
    text:
      zh: 周敏是财务部的空间负责人。看看概览、主题和负责人、文件夹的治理级别。然后在演示卡片里放入李娜修订的《差旅报销管理办法》第 7 版。
      en: 周敏 owns the Finance space. Look at the overview, the topics and their owners, and the folders' governance levels. Then, in the demo card, put in edition 7 of the travel policy, which 李娜 has revised.
      ja: 周敏は財務部スペースの責任者です。概要、トピックと責任者、フォルダーの統制レベルを見てから、デモのカードで李娜が改訂した《差旅报销管理办法》第 7 版を入れます。
    do:
      update: travel-policy-revised

  - as: mem_01HENGYUAN00000000CHENCHEN
    open: /document?source=src_01HENGYUAN0000000FINPOLICY&item=%E5%B7%AE%E6%97%85%2F%E5%B7%AE%E6%97%85%E6%8A%A5%E9%94%80%E7%AE%A1%E7%90%86%E5%8A%9E%E6%B3%95.md&view=annotated
    text:
      zh: 第 7 版放进来就生效了：住宿表里一线城市这一行现在是 650 元，标为现行。再问一次住宿的问题，写着 600 元的答疑和纪要仍标为已过时。最后可以在右上角的账户菜单里把界面换成英语或日语。
      en: Edition 7 holds as soon as it is in. The tier-1 city row of the rate table now says 650 and reads as current. Ask about the hotel again, and the FAQ and notes that still say 600 read as outdated. Finally, switch the interface to English or Japanese in the account menu.
      ja: 第 7 版は入れた時点で有効になります。宿泊表の一線都市の行は 650 元になり、現行として示されます。宿泊費をもう一度尋ねると、600 元のままの FAQ や議事録は古い値として示されます。最後に、右上のアカウントメニューで表示言語を英語か日本語に切り替えられます。
