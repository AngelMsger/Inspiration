# 青禾科技's predicate catalogue: the single-valued facts extraction normalizes into slots,
# so governance can compare values across documents. Aliases and unit words are how the
# documents write them; qualifiers separate facts that differ by scope.
predicates:
  - predicate: hotel_cap_per_night
    label: 住宿限额（每晚）
    knowledge_class: policy
    aliases: [住宿限额, 住宿上限, 住宿标准, 住宿费, 住宿]
    qualifiers:
      - name: 一线城市
        aliases: [一线城市, 北京、上海, 深圳的住宿]
      - name: 新一线城市
        aliases: [新一线城市]
      - name: 其他城市
        aliases: [其他城市, 其余城市, 其他地级市]
    value: {kind: money, unit: CNY/night, currency: CNY, words: [元]}

  - predicate: reimbursement_deadline_days
    label: 报销时限
    knowledge_class: policy
    aliases: [提交报销申请, 天内报销, 日内报销, 内提交报销]
    qualifiers:
      - name: 差旅
        aliases: [出差结束后, 差旅]
      - name: 日常费用
        aliases: [费用发生后, 日常费用]
    value: {kind: duration, unit: day, words: [日, 天]}

  - predicate: annual_leave_days
    label: 年休假天数
    knowledge_class: policy
    aliases: [年休假, 年假]
    qualifiers:
      - name: 工龄 1 至 10 年
        aliases: [满 1 年不满 10 年, 满一年, 第一年]
      - name: 工龄 10 至 20 年
        aliases: [满 10 年不满 20 年]
      - name: 工龄 20 年以上
        aliases: [已满 20 年的]
    value: {kind: duration, unit: day, words: [天]}

  - predicate: meal_allowance_per_day
    label: 伙食补助（每天）
    knowledge_class: policy
    aliases: [伙食补助]
    value: {kind: money, unit: CNY/day, currency: CNY, words: [元]}

  - predicate: taxi_cap_per_day
    label: 市内交通上限（每天）
    knowledge_class: policy
    aliases: [出租车, 网约车, 打车]
    value: {kind: money, unit: CNY/day, currency: CNY, words: [元]}

  - predicate: reimbursement_payment_day
    label: 报销付款日
    knowledge_class: process
    aliases: [报销款]
    value: {kind: enum, values: [每周三, 每周五]}

  - predicate: budget_draft_deadline
    label: 年度预算初稿截止日
    knowledge_class: process
    aliases: [预算初稿]
    value: {kind: text, values: [11 月 15 日, 11 月 20 日]}
