# The answer key of the decisive test, written by reading the files (README.md says how):
# for each fact, its values by the day each took effect and where the corpus states each,
# verbatim, with the file's revision. The value in effect on asked_on answers a question; the
# others are stale. `misleading` lists values the corpus states that never held (a draft, a
# summary that drops a condition); an answer giving one and not the value in effect is stale.
# `conflicting` lists values that current governed pages state beside the one in `values`:
# a right answer names them all. `pattern` and `case` say how the case was built.

