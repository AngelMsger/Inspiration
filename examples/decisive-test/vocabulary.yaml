# The facts the decisive test's questions follow, one entry per fact keys.yaml names, with the
# words the topics' documents use for it in English, Chinese and Japanese. Written from the
# key after the first paid reading (2026-11-02) found that the corpus had no catalogue, so no
# statement had a slot and governance had nothing to decide. It does what the company drive's
# catalogue does: a team that governs a topic names its high-value facts (amounts, limits,
# deadlines, feature states). Writing it took about an hour from the key; a team writing it
# from its own policies is the human cost the cost model counts.
