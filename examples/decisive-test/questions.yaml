      - "出差时住在朋友家而不是酒店，给主人的礼物最多可以报销多少？"
      - "出張でホテルの代わりに友人宅に泊まる場合、ホストへの手土産はいくらまで精算できますか？"
  - fact: "internet_while_traveling"
    ask:
