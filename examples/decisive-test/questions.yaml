# Questions to the decisive test's two topics, each fact asked once in English, Chinese and
# Japanese, as the topic's reader. keys.yaml gives each fact's answer, the stale values and the
# documents to cite. See questions.ts in apps/bench.

questions:
  - fact: "monthly_reimbursement_limit"
    ask:
      - "What is the maximum amount a team member can be reimbursed per month before extra approval is needed?"
      - "团队成员每月最多可以报销多少，超过后需要额外审批？"
      - "チームメンバーが追加の承認なしで精算できる月間の上限額はいくらですか？"
  - fact: "business_cards_limit"
    ask:
      - "How much can I expense for business cards per quarter?"
      - "每季度印制名片最多可以报销多少？"
      - "名刺の作成費は四半期あたりいくらまで経費にできますか？"
  - fact: "office_supplies_limit"
    ask:
      - "What is the monthly limit for office supplies and consumables?"
      - "办公用品和耗材每月的报销上限是多少？"
      - "事務用品・消耗品の月間の上限はいくらですか？"
  - fact: "marketing_navan_limit"
    ask:
      - "Up to what amount can a small marketing event purchase be expensed in Navan instead of going through Zip?"
      - "营销活动的小额采购，多少金额以内可以直接在 Navan 报销而不走 Zip 采购流程？"
      - "マーケティングイベントの少額購入は、Zip を通さずに Navan でいくらまで経費精算できますか？"
  - fact: "ground_transport_round_trip"
    ask:
      - "What is the limit for taxis or Uber per round trip on a business trip?"
      - "出差时出租车或网约车往返一次的报销上限是多少？"
      - "出張時のタクシーや配車サービスの往復の上限額はいくらですか？"
  - fact: "fuel_limit"
    ask:
      - "How much fuel can I expense per day when I drive for work?"
      - "因公开车时，每天的燃油费最多可以报销多少？"
      - "業務で車を運転する場合、燃料費は1日いくらまで精算できますか？"
  - fact: "parking_tolls_limit"
    ask:
      - "What is the daily limit for parking and tolls?"
      - "停车费和过路费每天的报销上限是多少？"
      - "駐車場代と通行料の1日あたりの上限はいくらですか？"
  - fact: "dry_cleaning_min_stay"
    ask:
      - "How long does a hotel stay have to be before I can expense dry cleaning?"
      - "住酒店要超过几天才能报销干洗费？"
      - "ホテルに何日を超えて滞在すればドライクリーニング代を精算できますか？"
  - fact: "client_meal_limit"
    ask:
      - "What is the per-person limit when I take a client out for dinner?"
      - "请客户吃晚饭，每人的报销上限是多少？"
      - "顧客と夕食をとる場合、1人あたりの上限はいくらですか？"
  - fact: "phone_service_monthly"
    ask:
      - "What is the monthly limit for reimbursing my cell phone service?"
      - "手机通信费每月最多可以报销多少？"
      - "携帯電話の月額料金はいくらまで精算できますか？"
  - fact: "home_internet_monthly"
    ask:
      - "How much of my home internet bill can I expense each month?"
      - "家里的宽带费每月可以报销多少？"
      - "自宅のインターネット料金は毎月いくらまで精算できますか？"
  - fact: "meals_per_day_traveling"
    ask:
      - "How much can I spend on meals per day while traveling for work?"
      - "出差期间每天的餐费最多可以报销多少？"
      - "出張中の食事代は1日いくらまで精算できますか？"
  - fact: "lost_baggage_cover"
    ask:
      - "How much does the business travel insurance pay if my luggage is lost on a business trip?"
      - "出差时行李丢失，商务差旅保险最多赔付多少？"
      - "出張中に荷物を紛失した場合、出張保険はいくらまで補償しますか？"
  - fact: "coworking_monthly_limit"
    ask:
