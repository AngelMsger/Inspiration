# What the bench needs to read Japanese. The synthetic tenant (src/synthesize.ts) is written
# only in Chinese so far, so this pack holds only the evidence audit's words.

# The evidence audit (src/audit.ts): a source keeps a value only in a clause that denies it
# and narrows it as the answer key's own quotes do. Every pack is read at once,
# since documents carry no language tag, so a word here must not be part of a word in
# another language: kanji shared with Chinese are left to the Chinese pack.
audit:
  # Where a clause ends. The reading point (、) does not end one.
  clause_ends: ["。", "！", "？"]
  negations:
    - "ない"
    - "ません"
    - "なし"
    - "無し"
    - "対象外"
    - "できず"
    - "られず"
    - "せず"
    - "誤り"
    - "間違い"
    - "偽り"
  # Phrases with a negation that bound or widen the value rather than deny it, and words that
  # hold a negation's kana without being one.
  not_negations:
    - "超えない"
    - "超えてはならない"
    - "超えてはいけない"
    - "上回らない"
    - "下回らない"
    - "未満"
    - "に限らず"
    - "にかかわらず"
    - "に関わらず"
    - "少ない"
    - "少なく"
  restrictions:
    - "のみ"
    - "だけ"
    - "に限る"
    - "に限り"
    - "に限定"
    - "を除く"
    - "を除き"
    - "以外"
    - "ただし"
    - "但し"
