demo:
  kicker: しくみ
  title: ルールが変われば、答えも変わる。
  label: >-
    アニメーション：メンバーが深圳の宿泊上限を尋ね、600 元という答えを得ます。新しい通知が届くと、答えは通知を出典とする 650 元に変わり、古い規程は旧版と表示されます。トピック担当者はワンクリックで提案された変更を確認します。
  steps:
    - title: ソースが変わる
      text: >-
        財務部が Feishu に、宿泊上限を引き上げる通知を出します。Inspiration が読み直すのは変わった 2 段落だけです。
    - title: 答えが追随する
      text: >-
        すべての回答、ナレッジページ、エージェントが 650 元と答え、通知を出典に挙げます。規程の古い記述は削除せず、旧版と表示します。
    - title: 担当者が確認する
      text: >-
        出張トピック担当者の李娜さんには、提案が選択済みの ToDo が 1 件届き、ワンクリックで確認できます。
  replay: もう一度再生
  caption: 架空の会社とサンプルデータによるイメージです。
  ui:
    company: 恒远机械
    search: 検索・質問
