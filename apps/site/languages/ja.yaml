demo:
  kicker: しくみ
  title: ルールが変われば、答えも変わる。
  label: >-
    アニメーション：メンバーが深圳の宿泊上限を尋ね、600 元という答えを得ます。新しい通知が届くと、答えは通知を出典とする 650 元に変わり、古い規程は旧版と表示されます。トピック担当者はワンクリックで提案された変更を確認します。
  steps:
    - title: ソースが変わる
      text: 財務部が Confluence に通知を出します。読み直すのは、変わった 2 段落だけ。
    - title: 答えが追随する
      text: 回答もページもエージェントも 650 元になり、通知を出典に挙げます。古い記述は旧版と表示。
    - title: 担当者が確認する
      text: 出張トピック担当の李娜さんが、提案された変更をワンクリックで確認します。
  caption: 架空の会社とサンプルデータによるイメージです。
  ui:
    company: 恒远机械
    search: 検索・質問
    question: 深圳出張のホテル代は、1泊いくらまで精算できますか？
    answerBefore: "マネージャー以下は 1 泊 "
    answerAfter: " 元まで精算できます。"
    note: 10月1日から通知に基づきます。規程第7条には 600 とありますが、すでに適用されません。
    original: 中国語の原文
    policy: 差旅费管理办法 · 第七条
    notice: 关于调整一线城市住宿标准的通知
