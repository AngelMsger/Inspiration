sources:
  kicker: ナレッジの出どころ
  title: ナレッジは、文書の外にもある。
  lead: 承認の実際の進み方にも、コードの本当の動きにも、前の四半期の調査にもあります。
  items:
    - title: Wiki と文書
      text: ドキュメント、Wiki、アップロードしたファイル。今は Lark、次に Confluence に対応します。
      fresh: 編集されたら、変わった段落だけを読み直します。
    - title: 承認フロー
      text: 数か月分の承認記録から、実際の運用どおりの手順書をつくります。
      fresh: 担当者の承認を経て公開。フローが変われば改めて確認します。
    - title: コードリポジトリ
      text: リポジトリをコードグラフにし、システムの実際の動きを規程の隣に並べます。
      fresh: マージのたびに、変更されたコードに依存する結論だけを確認し直します。
    - title: ディープリサーチ
      text: 社内のナレッジと許可された Web ソースから、結論・前提・根拠をまとめたレポートを作ります。
      fresh: 前提には確認日があり、影響する結論だけを確認し直します。
  samples:
    document:
      title: 出張旅費精算基準
      line: 一級都市・マネージャー以下の宿泊は 1泊
      value: 650 元
    approval:
      title: 出張承認 · 直近 90 日
      trips:
        - 7 日 · 上海
        - 3 日 · 北京
        - 6 日 · 深圳
      manager: 上長
      finance: 財務
      rule: 5 日を超えたら財務も承認
    code:
      change: "#482 宿泊上限を 650 に"
    research:
      title: 深圳の四つ星ホテル平均
      value: 1泊 610 元
      basis: 42 軒 · 見本市の週は上振れと仮定
      due: 12月1日に再確認
  upkeep: ソースはさまざまでも、鮮度と管理の仕組みはひとつ。同じ根拠、同じ担当者、同じ受信トレイ。

features:
  kicker: 特長
  title: 出典をたどれて、自ら最新であり続けるナレッジ。
  items:
    - title: すべての文に出典がある
      text: ナレッジは事実単位で保存され、原文引用と有効期間を持ちます。
    - title: 変更はビルドのように伝わる
      text: 変わった段落だけを読み直し、それを引用するものだけを作り直します。
    - title: 決めるのは人、量は追いつける範囲に
      text: 提案入りの ToDo が週ごとの小さな束に。ワンクリックで確認でき、定型的なものは任せられます。
    - title: ひとつの事実を、どの言語でも
      text: 中国語の規程が、英語や日本語の質問に答え、原文を引用します。
  trace:
    quote: 自 2026 年 10 月 1 日起，一线城市经理及以下人员住宿标准调整为每晚 650 元。
    gloss: >-
      機械翻訳：2026年10月1日より、一級都市のマネージャー以下の宿泊基準を1泊650元に改定する。
    source: 关于调整一线城市住宿标准的通知 · 第二条 · 09-28
  fresh:
    steps:
      - 通知を追加
      - 2 段落を読み取り
      - 事実 1 件が変更
      - 4 か所を再生成
    places:
      - 回答
      - 出張旅費精算基準
      - 出張ホテルの予約
      - 深圳カード
  govern:
    heading: 受信トレイ · 今週
    rows:
      - label: 要対応
        value: "1"
      - label: 提案どおりで処理可
        value: "6"
      - label: 代わりに決定済み
        value: "34"
    action: 提案どおり 6 件を処理
  language:
    fact: 1泊 650 元
    holds: 2026-10-01 から
    source: ひとつの事実を、中国語の原文で引用

results:
  kicker: 検証結果
  title: 約束ではなく、実測。
  lead: 内容の変更や食い違いを集めたテストで、Inspiration は**成熟した RAG より多く正解し**、簡潔な回答は**コストが 7 分の 1** でした。
  items:
    - value: "+6.9"
      unit: ポイント
      label: 変更や食い違いのある事実で、成熟した RAG を上回った正解率
      bars: [Inspiration, 成熟した RAG]
      foot: 変わっていない事実：どちらも 72 問中 70 問正解。
    - value: 27 / 27
      unit: ""
      label: 別の文書で告知された変更に、すべて新しい値で回答
      bars: [Inspiration, ガバナンスなし]
      foot: どちらもトピックの全文書を読みます。違いはガバナンスだけです。
    - value: 1/7
      unit: ""
      label: 1 回答あたりのモデルコストは成熟した RAG の 7 分の 1、正解数は同等
      bars: [Inspiration 簡潔な回答, 成熟した RAG]
      foot: 276 問中の正解 242 対 234。1 回答の入力 1,961 トークン対 8,954。
  right: "{of} 問中 {value} 問"
  money: "{value} 元"
  why: なぜ効くのか：モデルが間違えるのは入力が長いからではなく、聞かれた事実に競合する値が入力にあるからです。Inspiration はモデルが読む前に、どの値が有効かを決めておきます。
  source: これを裏付ける研究があります。
  note: ラボでの結果（2026 年 11 月 3 日と 4 日の実行）：ひとつのテストコーパスの 2 トピック、276 問を DeepSeek V4.1 Flash が回答。成熟した RAG はハイブリッド検索、リランカー、質問の翻訳、12〜16 段落を使います。ガバナンスのルールはこのコーパスで調整したもので、実データでのより大きな検証はこれからです。
  method: 測定方法
  methodPath: docs/design/validation.md

agents:
  kicker: エージェント向け
  title: 人にもエージェントにも、同じ答えを。
  lead: 社内のエージェントは MCP と REST で同じ管理されたナレッジにアクセスし、代理する人として動きます。
  points:
    - "**タスクに合わせたツール**：質問・検索・閲覧・変更の追跡。"
    - すべての結果に、**出典・版・状態**とトークン見積もりが付きます。
    - エージェントは**読むことと提案だけ**。変更は人が承認します。
  note: イメージです。エージェント API は設計中です。
  question: 深圳出張、マネージャーの宿泊上限は 1 泊いくら？
  answer: 2026-10-01 から 1 泊 650 元。

enterprise:
  kicker: 企業のために
  title: 誰が何を読めるかは、企業が決める。
  items:
    - title: スペースには担当者がいる
      text: 閲覧できる人は、スペースの担当者が決めます。
    - title: 公開するまでは自分だけ
      text: メンバーごとに非公開スペース。公開はレビューを経て。
    - title: ソースもモデルも管理下に
      text: コンテンツは、その機密レベルを許可されたモデルにだけ送られます。
    - title: クラウドでも自社サーバーでも
      text: 同じコードで、ホスト型にもプライベート環境にも。

closing:
  title: 会社の変化に、ナレッジが追いつく。
  note: Inspiration は開発中です。最初のチームを迎える準備が整ったら、ここで早期利用の受付を始めます。

footer:
  line: 例に登場する会社名・人名・数値はすべて架空のものです。
