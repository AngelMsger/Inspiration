features:
  kicker: 特長
  title: 出典をたどれて、自ら最新であり続けるナレッジ。
  items:
    - title: すべての文に出典がある
      text: >-
        Inspiration はナレッジを一つひとつの事実として保存し、各事実は出典の原文引用と有効期間を持ちます。ページも回答もこれらの事実から組み立てられるので、どの文からでも元の段落を開けます。
    - title: 変更はビルドのように伝わる
      text: >-
        ソースが変わると、Inspiration は変わった段落だけを読み直し、それを引用しているものだけを作り直します。二重に取り込むことはなく、重要でない変更で人を煩わせることもありません。
    - title: 決めるのは人、量は追いつける範囲に
      text: >-
        アシスタントが先に読み込み、人の判断が必要なものを週ごとの小さな束にまとめ、提案を記入しておきます。担当者はワンクリックで確認でき、定型的なものは任せることもできます。アシスタントが行ったことには、すべて理由と取り消しがあります。
    - title: ひとつの事実を、どの言語でも
      text: >-
        中国語で書かれた規程が、英語や日本語の質問に答え、原文を引用します。翻訳は同じナレッジの写しであり、別のバージョンにはなりません。
  trace:
    quote: 自 2026 年 10 月 1 日起，一线城市经理及以下人员住宿标准调整为每晚 650 元。
    gloss: >-
      機械翻訳：2026年10月1日より、一級都市のマネージャー以下の宿泊基準を1泊650元に改定する。
    source: 关于调整一线城市住宿标准的通知 · 第二条 · 09-28
  fresh:
    steps:
      - 通知を追加
      - 2 段落を読み取り
      - 事実 1 件が変更
      - 4 か所を再生成
    places:
      - 回答
      - 出張旅費精算基準
      - 出張ホテルの予約
      - 深圳カード
  govern:
    heading: 受信トレイ · 今週
    rows:
      - label: 要対応
        value: "1"
      - label: 提案どおりで処理可
        value: "6"
      - label: 代わりに決定済み
        value: "34"
    action: 提案どおり 6 件を処理
  language:
    fact: 1泊 650 元
    holds: 2026-10-01 から
    source: ひとつの事実を、中国語の原文で引用

agents:
  kicker: エージェント向け
  title: 人にもエージェントにも、同じ答えを。
  lead: >-
    社内のエージェントは MCP と REST で同じ管理されたナレッジにアクセスします。代理する人として動き、その人が読めるものだけを読みます。受け取るのは、5 つの版から集めた 5 つの段落ではなく、現在有効な値とその出典、有効になった日付です。
  points:
    - 質問・検索・閲覧・変更の追跡。ツールはエージェントがしたいことに合わせて設計しています。
    - すべての結果に、出典・版・状態・トークン見積もりが付きます。
    - エージェントは読むことと提案だけ。ナレッジは人が承認したときにだけ変わります。
  note: イメージです。エージェント API は設計中です。
  question: 深圳出張、マネージャーの宿泊上限は 1 泊いくら？
  answer: 2026-10-01 から 1 泊 650 元。

enterprise:
  kicker: 企業のために
  title: 誰が何を読めるかは、企業が決める。
  items:
    - title: スペースには担当者がいる
      text: >-
        各スペースの担当者が閲覧者を決めます。ソース側の権限は警告にとどめるので、アクセスが十数個のアプリの設定に左右されません。
    - title: 公開するまでは自分だけ
      text: >-
        メンバーはそれぞれ非公開のマイスペースを持ちます。公開すると、スペース担当者の確認を経て共有スペースに移ります。
    - title: ソースもモデルも管理下に
      text: >-
        まず Feishu と Lark に対応し、ほかのソースも順次追加します。コンテンツは、その機密レベルを扱うことを許可されたモデルにだけ送られます。
    - title: クラウドでも自社サーバーでも
      text: >-
        同じコードベースが、ホスト型サービスとしてもプライベート環境としても動き、日本語・英語・中国語に対応します。

access:
  kicker: 早期利用
  title: Inspiration は開発中です。
  text: >-
    現時点では、ダウンロードや申し込みの受付はしていません。最初のチームを迎える準備が整いましたら、ここで早期利用の受付を始めます。

footer:
  line: Inspiration は開発中です。例に登場する会社名・人名・数値はすべて架空のものです。
