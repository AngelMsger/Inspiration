sources:
  kicker: Where knowledge comes from
  title: Knowledge lives in more than documents.
  lead: >-
    It is in how approvals really go, in what the code actually does, in research someone did
    last quarter. Inspiration reads each where it lives, and holds all of it to the same standard.
  items:
    - title: Wikis and documents
      text: >-
        Feishu and Lark docs and wikis and uploaded files, with Confluence and DingTalk next. They
        are read passage by passage, so every quote points at the paragraph it came from.
      fresh: An edit re-reads only the passages that changed.
    - title: Approval flows
      text: >-
        A flow's definition and months of its records become a procedure: who approves what, in
        which order, as it really happens. Each step says whether it was defined, observed or
        inferred.
      fresh: >-
        The procedure owner approves it before anyone reads it, and a redefined flow comes back
        for review.
    - title: Code repositories
      text: >-
        A connected repository is mirrored, mapped as a code graph and researched topic by topic,
        so how the expense system really checks a cap sits on the same page as the policy.
      fresh: >-
        Each merge is compared on the graph. Only conclusions that rest on changed code are checked
        again, and a disagreement with a document goes to the person who maintains it.
    - title: Deep research
      text: >-
        The research agent works across your knowledge and approved web sources, and writes a
        report of conclusions, assumptions and evidence. The report becomes a source like any
        other.
      fresh: >-
        Each assumption carries a date to check it again. When what it cites changes, only the
        affected conclusions are checked, and a new version is written only if one changes.
  freshLabel: "Staying current: "
  upkeep: "Different sources, one upkeep: the same evidence, the same owners, the same inbox."

features:
  kicker: What makes it different
  title: Knowledge you can check, that keeps itself current.
  items:
    - title: Every sentence has a source
      text: >-
        Inspiration stores knowledge as single facts, each with a verbatim quote from its source
        and the dates it holds. Pages and answers are built from those facts, so any sentence
        opens to the passage behind it.
    - title: Changes flow through like a build
      text: >-
        When a source changes, Inspiration re-reads only the passages that changed and rebuilds
        only what cites them. Nothing is imported twice, and nobody is asked about changes that
        do not matter.
    - title: People decide, in amounts they can keep up with
      text: >-
        The assistant does the reading and sorts what needs a person into a short weekly pile,
        with its suggestion already filled in. Owners confirm with one press, or let it settle
        the routine ones. Everything it does has a reason and an undo.
    - title: One fact, in every language
      text: >-
        A policy written in Chinese answers a question asked in English or Japanese, and cites
        the original. Translations are copies of the same knowledge, never a second version of
        it.
  trace:
    quote: 自 2026 年 10 月 1 日起，一线城市经理及以下人员住宿标准调整为每晚 650 元。
    gloss: >-
      Machine translation: from 1 October 2026, the hotel cap for managers and below in tier-1
      cities is 650 yuan a night.
    source: 关于调整一线城市住宿标准的通知 · 第二条 · 09-28
  fresh:
    steps:
      - Notice added
      - 2 passages read
      - 1 fact changed
      - 4 places rebuilt
    places:
      - Answers
      - Travel expenses page
      - Booking a hotel
      - Shenzhen card
  govern:
    heading: Inbox · this week
    rows:
