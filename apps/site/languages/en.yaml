problem:
  kicker: The problem
  title: Stop guessing which document is right.
  lead: One hotel rule, five documents. Search finds all five, and nobody can tell which one counts.
  label: >-
    Animation: someone asks Inspiration for the Shenzhen hotel cap. Five documents disagree;
    Inspiration answers 650 yuan a night from 1 October, per the notice of 28 September, and marks
    three older documents outdated.
  documents:
    - name: Travel expense policy, article 7
      place: Finance policy library
      value: "600"
      mark: "old"
    - name: Notice on tier-1 city hotel rates
      place: Finance, 28 Sep
      value: 650 from 1 Oct
      mark: "source"
    - name: Expense FAQ
      place: Finance wiki
      value: "650"
      mark: ""
    - name: City hotel rates.csv
      place: Shared drive
      value: "600"
      mark: "old"
    - name: New-hire guide
      place: HR wiki
      value: "600"
      mark: "old"
  answerLabel: Answer
  answer: 650 yuan a night from 1 October
  why: Per the notice of 28 September · confirmed by Li Na, who maintains travel rules
  docsLabel: Documents
  conflict: 2 different values
  settled: 3 marked outdated, none deleted

demo:
  kicker: How it works
  title: When the rules change, the answers change with them.
  label: >-
    Animation: a member asks about the hotel cap in Shenzhen and gets 600 yuan. A new notice
    arrives, the answer becomes 650 yuan with the notice as its source and the old policy marked
    outdated, and the topic owner confirms the suggested change with one press.
  steps:
    - title: A source changes
      text: Finance posts a notice in Feishu. Only the two passages that changed are read.
    - title: Answers follow
      text: Answers, pages and agents now say 650 and cite the notice. The old line is marked outdated.
    - title: The owner confirms
      text: Li Na, who maintains the travel rules, confirms the suggested change with one press.
  caption: An illustration with a made-up company and sample data.
  ui:
    company: Hengyuan Machinery
    search: Search or ask
    question: How much can I claim for a hotel night in Shenzhen?
    answerBefore: "Managers and below can claim up to "
    answerAfter: " yuan a night."
    note: From 1 October, per the notice. Article 7 of the policy still says 600, which no longer applies.
    original: Chinese original
    policy: 差旅费管理办法 · 第七条
    notice: 关于调整一线城市住宿标准的通知
    outdated: Outdated
    changeLabel: New in Feishu
    changeMeta: 2 passages read · 1 fact changed
    inbox: Inbox
    owner: Li Na · topic owner, Travel
    todoTitle: The tier-1 hotel cap is now 650
    option: Confirm 650 and ask Finance to revise the policy
    suggested: Suggested
    reason: The notice is newer and says it replaces article 7.
    confirm: Confirm
    confirmed: Confirmed
    confirmedBy: Confirmed by Li Na · just now

sources:
  kicker: Where knowledge comes from
  title: Knowledge lives in more than documents.
  lead: It is also in how approvals really go, in what the code actually does, in last quarter's research.
  items:
    - title: Wikis and documents
      text: Feishu and Lark docs, wikis and uploads, with Confluence and DingTalk next.
      fresh: An edit re-reads only what changed.
    - title: Approval flows
      text: Months of approval records become a procedure, written as things really happen.
      fresh: Its owner approves it, and again when the flow changes.
    - title: Code repositories
      text: A repository mapped as a code graph, so how a system really behaves sits beside the policy.
      fresh: Each merge re-checks only conclusions that rest on changed code.
    - title: Deep research
      text: Reports of conclusions, assumptions and evidence, from your knowledge and approved web sources.
      fresh: Assumptions carry dates; only affected conclusions are checked again.
  samples:
    document:
      title: Travel expenses
      line: "Tier-1 cities, managers and below, hotel per night:"
      value: 650 yuan
    approval:
      title: Trip approvals · last 90 days
      trips:
        - 7 days · Shanghai
        - 3 days · Beijing
        - 6 days · Shenzhen
      manager: Manager
      finance: Finance
      rule: Over 5 days, Finance also approves
    code:
      change: "#482 Hotel cap to 650"
    research:
      title: Shenzhen 4-star average
      value: 610 a night
      basis: 42 hotels · assumes trade-fair weeks run higher
      due: Re-check 1 Dec
  upkeep: "Different sources, one upkeep: the same evidence, the same owners, the same inbox."

features:
  kicker: What makes it different
  title: Knowledge you can check, that keeps itself current.
  items:
    - title: Every sentence has a source
      text: Knowledge is kept as single facts, each with a verbatim quote and the dates it holds.
    - title: Changes flow through like a build
      text: Only the passages that changed are re-read, and only what cites them is rebuilt.
    - title: People decide, in amounts they can keep up with
      text: Suggestions arrive filled in, in a short weekly pile. Confirm with one press, or let routine ones settle.
    - title: One fact, in every language
      text: A policy written in Chinese answers questions in English or Japanese, and cites the original.
  trace:
    quote: 自 2026 年 10 月 1 日起，一线城市经理及以下人员住宿标准调整为每晚 650 元。
    gloss: >-
      Machine translation: from 1 October 2026, the hotel cap for managers and below in tier-1
      cities is 650 yuan a night.
    source: 关于调整一线城市住宿标准的通知 · 第二条 · 09-28
  fresh:
    steps:
      - Notice added
      - 2 passages read
      - 1 fact changed
      - 4 places rebuilt
    places:
      - Answers
      - Travel expenses page
      - Booking a hotel
      - Shenzhen card
  govern:
    heading: Inbox · this week
    rows:
      - label: Needs you
        value: "1"
      - label: Can follow the suggestion
        value: "6"
      - label: Decided for you
        value: "34"
    action: Settle these 6
  language:
    fact: 650 yuan a night
    holds: from 2026-10-01
    source: One fact, cited in its Chinese original

agents:
  kicker: For agents
  title: One answer, for people and agents.
  lead: Your agents reach the same governed knowledge through MCP and REST, acting as the person they work for.
  points:
    - "**Tools shaped by the task:** ask, search, read, follow changes."
    - Every result carries its **source, version and status**, and a token estimate.
    - Agents **read and propose**. Only people approve changes.
  note: Illustrative. The agent API is in design.
  question: Hotel cap per night in Shenzhen for a manager?
  answer: 650 yuan a night from 2026-10-01.

enterprise:
  kicker: Built for companies
  title: Your company decides who reads what.
  items:
    - title: Spaces with owners
      text: Each space's owner decides who reads it.
    - title: Private until published
      text: Every member has a private space; publishing goes through review.
    - title: Your sources, your models
      text: Content goes only to model providers cleared for its sensitivity.
    - title: Cloud or your own servers
      text: Hosted, or deployed privately from the same code.

closing:
  title: Knowledge that keeps up with your company.
  note: Inspiration is in active development. Early access will open here once it is ready for its first teams.

footer:
  line: The company, people and figures in the examples are made up.
