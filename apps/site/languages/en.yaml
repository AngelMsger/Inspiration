        value: "1"
      - label: Can follow the suggestion
        value: "6"
      - label: Decided for you
        value: "34"
    action: Settle these 6
  language:
    fact: 650 yuan a night
    holds: from 2026-10-01
    source: One fact, cited in its Chinese original

agents:
  kicker: For agents
  title: One answer, for people and agents.
  lead: >-
    Your agents reach the same governed knowledge through MCP and REST. They act as the person
    they work for and see only what that person may read. They get the value in force with its
    source and the date it holds, instead of five passages from five versions.
  points:
    - "Ask, search, read and follow changes: tools shaped by what an agent is trying to do."
    - Every result carries its source, version, status and a token estimate.
    - Agents read and propose. Knowledge changes only when a person approves.
  note: Illustrative. The agent API is in design.
  question: Hotel cap per night in Shenzhen for a manager?
  answer: 650 yuan a night from 2026-10-01.

enterprise:
  kicker: Built for companies
  title: Your company decides who reads what.
  items:
    - title: Spaces with owners
      text: >-
        Each space's owner decides who reads it. Source permissions only warn, so access never
        depends on a dozen apps' settings.
    - title: Private until published
      text: >-
        Every member has a private My space. Publishing moves knowledge into a shared space after
        the space owner's review.
    - title: Your sources, your models
      text: >-
        Feishu and Lark first, with more sources to follow. Content goes only to model providers
        cleared for its sensitivity.
    - title: Cloud or your own servers
      text: >-
        One codebase runs as a hosted service or as a private deployment, in English, Chinese and
        Japanese.

