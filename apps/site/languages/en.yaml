features:
  kicker: What makes it different
  title: Knowledge you can check, that keeps itself current.
  items:
    - title: Every sentence has a source
      text: >-
        Inspiration stores knowledge as single facts, each with a verbatim quote from its source
        and the dates it holds. Pages and answers are built from those facts, so any sentence
        opens to the passage behind it.
    - title: Changes flow through like a build
      text: >-
        When a source changes, Inspiration re-reads only the passages that changed and rebuilds
        only what cites them. Nothing is imported twice, and nobody is asked about changes that
        do not matter.
    - title: People decide, in amounts they can keep up with
      text: >-
        The assistant does the reading and sorts what needs a person into a short weekly pile,
        with its suggestion already filled in. Owners confirm with one press, or let it settle
        the routine ones. Everything it does has a reason and an undo.
    - title: One fact, in every language
      text: >-
        A policy written in Chinese answers a question asked in English or Japanese, and cites
        the original. Translations are copies of the same knowledge, never a second version of
        it.
  trace:
    quote: 自 2026 年 10 月 1 日起，一线城市经理及以下人员住宿标准调整为每晚 650 元。
    gloss: >-
      Machine translation: from 1 October 2026, the hotel cap for managers and below in tier-1
      cities is 650 yuan a night.
    source: 关于调整一线城市住宿标准的通知 · 第二条 · 09-28
  fresh:
    steps:
      - Notice added
      - 2 passages read
      - 1 fact changed
      - 4 places rebuilt
    places:
      - Answers
      - Travel expenses page
      - Booking a hotel
      - Shenzhen card
  govern:
    heading: Inbox · this week
    rows:
      - label: Needs you
        value: "1"
      - label: Can follow the suggestion
        value: "6"
      - label: Decided for you
        value: "34"
    action: Settle these 6
  language:
    fact: 650 yuan a night
    holds: from 2026-10-01
    source: One fact, cited in its Chinese original

agents:
  kicker: For agents
  title: One answer, for people and agents.
  lead: >-
    Your agents reach the same governed knowledge through MCP and REST. They act as the person
    they work for and see only what that person may read. They get the value in force with its
    source and the date it holds, instead of five passages from five versions.
  points:
    - "Ask, search, read and follow changes: tools shaped by what an agent is trying to do."
    - Every result carries its source, version, status and a token estimate.
    - Agents read and propose. Knowledge changes only when a person approves.
  note: Illustrative. The agent API is in design.
  question: Hotel cap per night in Shenzhen for a manager?
  answer: 650 yuan a night from 2026-10-01.

enterprise:
  kicker: Built for companies
  title: Your company decides who reads what.
  items:
    - title: Spaces with owners
      text: >-
        Each space's owner decides who reads it. Source permissions only warn, so access never
        depends on a dozen apps' settings.
    - title: Private until published
      text: >-
        Every member has a private My space. Publishing moves knowledge into a shared space after
        the space owner's review.
    - title: Your sources, your models
      text: >-
        Feishu and Lark first, with more sources to follow. Content goes only to model providers
        cleared for its sensitivity.
    - title: Cloud or your own servers
      text: >-
        One codebase runs as a hosted service or as a private deployment, in English, Chinese and
        Japanese.

access:
  kicker: Early access
  title: Inspiration is in active development.
  text: >-
    There is nothing to download or sign up for yet. Early access will open here once the product is ready for its first teams.

footer:
