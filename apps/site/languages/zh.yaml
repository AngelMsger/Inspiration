demo:
  kicker: 工作方式
  title: 规则一变，答案跟着变。
  label: >-
    动画：一位成员问深圳的住宿上限，得到 600 元。一份新通知进来后，回答变成 650 元并引用这份通知，旧制度标为已过时；主题维护人按一下，确认建议的修改。
  steps:
    - title: 来源变了
      text: >-
        财务部在飞书发了一份通知，提高了住宿上限。Inspiration 只读变化的两段，不重读整个知识库。
    - title: 答案跟上
      text: >-
        所有回答、知识页和智能体都改成 650 元，并引用这份通知。管理办法里的旧数字标为已过时，不会被删掉。
    - title: 维护人确认
      text: >-
        差旅主题的维护人李娜收到一条待办，建议已经选好，按一下就确认。
  replay: 重播
  caption: 示意动画，公司和数据均为虚构。
