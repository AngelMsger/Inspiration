sources:
  kicker: 知识来源
  title: 知识不只写在文档里。
  lead: >-
    它藏在审批实际的走法里，藏在代码真正的行为里，也藏在上个季度某人做过的调研里。Inspiration 在它们各自所在的地方读取，并用同一套标准对待。
  items:
    - title: 知识库与文档
      text: >-
        飞书和 Lark 的文档、知识库，以及上传的文件；Confluence 和钉钉随后接入。按段落读取，每条引用都指向它来自的那一段。
      fresh: 文档一改，只重读改动的段落。
    - title: 审批流
      text: >-
        把审批流的定义和几个月的审批记录整理成流程：谁审批什么、按什么顺序，照实际发生的来写。每一步都标明来自定义、来自记录，还是推断。
      fresh: 流程维护人批准后才对外可见；审批流重新定义后，会再请其确认。
    - title: 代码仓库
      text: >-
        接入的仓库会保留一份镜像，建成代码图谱，再按主题调研。报销系统实际怎样校验上限，和制度本身出现在同一页上。
      fresh: 每次合并都在图谱上比对，只复查依赖改动代码的结论；和文档说法不一致时，交给该文档的维护人。
    - title: 深度调研
      text: >-
        调研智能体在公司知识和获准的网络来源中工作，写出包含结论、假设和证据的报告。报告本身就成为一个来源，和其他来源一样。
      fresh: 每条假设都带着复核日期；引用的材料一变，只复查受影响的结论，结论真的变了才写新版本。
  freshLabel: 如何保鲜：
  upkeep: 来源各不相同，保鲜和治理是同一套：同样的原文证据，同样的维护人，同样的待办。

features:
  kicker: 不一样的地方
  title: 查得到出处，自己保持最新的知识。
  items:
    - title: 每句话都有出处
      text: >-
        Inspiration 把知识存成一条条事实，每条都带着来源的原文引用和生效时间。知识页和回答都由这些事实组成，任何一句话都能点开看到背后的原文。
    - title: 变化像构建一样传播
      text: >-
        来源一变，Inspiration 只重读变化的段落，只重建引用它们的内容。不用重新导入，也不会为无关紧要的变化去打扰人。
    - title: 人来决定，量在跟得上的范围
      text: >-
        助手先把材料读完，把需要人处理的事归成每周一小摞，并填好建议。维护人按一下就能确认，例行的也可以交给助手处理。助手做的每件事都能看原因、能撤销。
    - title: 一条事实，任何语言
      text: >-
        用中文写的制度，可以回答用英文或日文提的问题，并引用中文原文。译文只是同一份知识的副本，不会变成第二个版本。
  trace:
    quote: 自 2026 年 10 月 1 日起，一线城市经理及以下人员住宿标准调整为每晚 650 元。
    gloss: ""
    source: 关于调整一线城市住宿标准的通知 · 第二条 · 09-28
  fresh:
    steps:
      - 新增通知
      - 读了 2 段
      - 1 条事实有变
      - 重建 4 处
    places:
      - 回答
      - 差旅报销标准
      - 预订出差酒店
      - 深圳卡片
  govern:
    heading: 待办 · 本周
    rows:
      - label: 需要你
        value: "1"
      - label: 可以按建议处理
        value: "6"
      - label: 已替你决定
        value: "34"
    action: 按建议处理这 6 件
  language:
    fact: 每晚 650 元
    holds: 2026-10-01 起
    source: 同一条事实，引用中文原文

agents:
  kicker: 给智能体
  title: 人和智能体，读到同一个答案。
  lead: >-
    公司的智能体通过 MCP 和 REST 读取同一份治理过的知识。它以所代表的那个人的身份工作，只看到这个人能看的内容。它拿到的是现行的值、出处和生效日期，而不是五个版本里的五段原文。
  points:
    - 提问、搜索、阅读、跟踪变化：工具按智能体要做的事来设计。
    - 每个结果都带着出处、版本、状态和 token 估算。
    - 智能体只读取和提议，知识只在有人批准后才改变。
  note: 示意。智能体接口还在设计中。
  question: 深圳出差，经理住宿每晚上限？
  answer: 2026-10-01 起每晚 650 元。

enterprise:
  kicker: 为企业而建
  title: 谁能读什么，由企业决定。
  items:
    - title: 每个空间都有维护人
      text: >-
        空间维护人决定谁能读这个空间。来源应用的权限只做提醒，权限不取决于十几个应用各自的设置。
    - title: 发布之前只属于自己
      text: >-
        每个成员都有私有的我的空间。发布时，知识经空间维护人审核后移入共享空间。
    - title: 来源和模型都在掌控中
      text: >-
        先支持飞书，更多来源随后接入。内容只会发给获准处理其敏感级别的模型服务。
    - title: 云服务或私有部署
      text: >-
        同一套代码既能作为云服务运行，也能私有部署，支持中文、英文和日文。

