sources:
  kicker: 知识来源
  title: 知识不只写在文档里。
  lead: 它也藏在审批实际的走法里、代码真正的行为里、上个季度的调研里。
  items:
    - title: 知识库与文档
      text: 飞书和 Lark 的文档、知识库和上传文件，Confluence、钉钉随后接入。
      fresh: 文档一改，只重读改动的段落。
    - title: 审批流
      text: 几个月的审批记录整理成流程，照实际发生的来写。
      fresh: 流程维护人批准后生效，审批流一改再请其确认。
    - title: 代码仓库
      text: 仓库建成代码图谱，系统实际怎么运作，就写在制度旁边。
      fresh: 每次合并，只复查依赖改动代码的结论。
    - title: 深度调研
      text: 在公司知识和获准的网络来源里调研，写成有结论、假设和证据的报告。
      fresh: 假设带着复核日期，只复查受影响的结论。
  samples:
    document:
      title: 差旅报销标准
      line: 一线城市经理及以下，住宿每晚
      value: 650 元
    approval:
      title: 出差审批 · 近 90 天
      trips:
        - 7 天 · 上海
        - 3 天 · 北京
        - 6 天 · 深圳
      manager: 经理
      finance: 财务
      rule: 超过 5 天要财务加签
    code:
      change: "#482 住宿上限改为 650"
    research:
      title: 深圳四星酒店均价
      value: 每晚 610 元
      basis: 42 家酒店 · 假设会展周上浮
      due: 12 月 1 日复核
  upkeep: 来源各不相同，保鲜和治理是同一套：同样的证据，同样的维护人，同样的待办。

