      note: 1
    - text: 常读常新。
      note: 2
  lead: >-
    Inspiration 把分散在公司各处的文档、审批流和调研报告，变成治理过的知识。每条事实都保留原文出处和一位维护人，来源一变就跟着更新，人和智能体都在自己的权限内读到它。
