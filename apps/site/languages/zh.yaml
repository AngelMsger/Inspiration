    - title: 变化像构建一样传播
      text: 只重读变化的段落，只重建引用它们的内容。
    - title: 人来决定，量在跟得上的范围
      text: 建议已经填好，归成每周一小摞。按一下确认，例行的交给助手。
    - title: 一条事实，任何语言
      text: 中文写的制度，可以回答英文或日文的提问，并引用原文。
