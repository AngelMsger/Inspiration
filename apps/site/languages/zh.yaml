results:
  kicker: 实验数据
  title: 实测，不是承诺。
  lead: 在一套专考“内容改过、说法冲突”的测试上，Inspiration **比成熟 RAG 答对得更多**，精简回答的**成本只有它的七分之一**。
  items:
    - value: "+6.9"
      unit: 个百分点
      label: 在内容改过或说法冲突的事实上，比成熟 RAG 多答对
      bars: [Inspiration, 成熟 RAG]
      foot: 没改过的事实：72 题各答对 70 题。
    - value: 27 / 27
      unit: ""
      label: 在另一份文档里宣布的变更，全部答出新值
      bars: [Inspiration, 同样的文档，不做治理]
      foot: 两边都读完主题的全部文档，差别只在治理。
    - value: 1/7
      unit: ""
      label: 单次回答的模型成本只有成熟 RAG 的七分之一，答对的题一样多
      bars: [Inspiration 精简回答, 成熟 RAG]
      foot: 276 题中答对 242 对 234；每次输入 1,961 个 token 对 8,954 个。
  right: "{of} 题答对 {value}"
  money: "{value} 元"
  why: 为什么有效：模型答错，不是因为输入太长，而是因为输入里同一个事实有互相竞争的值。Inspiration 在模型读之前就定下哪个值算数。
  source: 有研究支持这一点。
  note: 实验室结果，来自 2026 年 11 月 3 日和 4 日的运行：一套测试语料中两个主题的 276 个问题，由 DeepSeek V4.1 Flash 作答。成熟 RAG 用混合检索、重排序、问题翻译和 12 到 16 段原文。治理规则是在这套语料上调出来的，更大的真实数据测试在后面。
  method: 测量方法
  methodPath: docs/zh/design/validation.md

agents:
  kicker: 给智能体
  title: 人和智能体，读到同一个答案。
  lead: 智能体通过 MCP 和 REST 读取同一份治理过的知识，以所代表的那个人的身份工作。
  points:
    - "**按任务设计的工具**：提问、搜索、阅读、跟踪变化。"
    - 每个结果都带着**出处、版本和状态**，以及 token 估算。
    - 智能体**只读取和提议**，改动由人批准。
  note: 示意。智能体接口还在设计中。
  question: 深圳出差，经理住宿每晚上限？
  answer: 2026-10-01 起每晚 650 元。

enterprise:
  kicker: 为企业而建
  title: 谁能读什么，由企业决定。
  items:
    - title: 每个空间都有维护人
      text: 空间维护人决定谁能读这个空间。
    - title: 发布之前只属于自己
      text: 每个成员都有私有空间，发布要经过审核。
    - title: 来源和模型都在掌控中
      text: 内容只发给获准处理其敏感级别的模型。
    - title: 云服务或私有部署
      text: 同一套代码，既可云上使用，也可私有部署。

closing:
